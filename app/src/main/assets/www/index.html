<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ossi TV</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="splash"><img src="img/logo.png" alt=""><i></i></div>
<div id="stage">
  <section id="login" class="screen bg hidden"></section>
  <section id="home" class="screen bg hidden"></section>
  <section id="live" class="screen live hidden"></section>
  <section id="vodm" class="screen bg hidden"></section>
  <section id="vods" class="screen bg hidden"></section>
  <section id="detail" class="screen bg hidden"></section>
  <section id="settings" class="screen bg hidden"></section>
  <section id="multi" class="screen hidden"></section>
  <section id="player" class="screen hidden">
    <div id="pInfo" class="pinfo"></div>
    <div id="pVod" class="pvod hidden"></div>
    <div id="pSpin" class="pspin hidden"><div class="spinner"></div><div id="pSpinT"></div></div>
    <div id="pErr" class="perr hidden"></div>
  </section>
  <div id="modal" class="hidden"></div>
  <div id="numBadge" class="hidden"></div>
  <div id="toast" class="hidden"></div>
</div>
<script src="js/android.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
<script src="js/vgrid.js"></script>
<script src="js/player.js"></script>
<script src="js/ui.js"></script>
<script src="js/live.js"></script>
<script src="js/vod.js"></script>
<script src="js/settings.js"></script>
<script src="js/home.js"></script>
<script src="js/extra.js"></script>
<script src="js/main.js"></script>

</html>
