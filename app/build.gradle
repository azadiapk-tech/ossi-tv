plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ossi.iptv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ossi.iptv'
        minSdk 21
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '5') as int)
        versionName(System.getenv('VERSION_NAME') ?: '1.4')
    }

    // Fixed key so every new build installs as an update over the old one.
    signingConfigs {
        ossi {
            storeFile file('ossi.keystore')
            storePassword 'ossi1234'
            keyAlias 'ossi'
            keyPassword 'ossi1234'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.ossi
        }
        debug {
            signingConfig signingConfigs.ossi
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    def media3 = '1.3.1'   // matches the FFmpeg decoder build below (Jellyfin publishes 1.3.1, not 1.4.x)
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    // FFmpeg sound decoders (MP2, AC3, E-AC3, DTS ...): many Kurdish / Arabic channels send MP2 sound,
    // which Android itself cannot decode. Built for media3 1.3.1 by the Jellyfin project.
    implementation "org.jellyfin.media3:media3-ffmpeg-decoder:${media3}+2"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"   // needed by the FFmpeg decoder
    implementation "androidx.annotation:annotation:1.8.2"
    implementation "androidx.core:core:1.13.1"
}
