name: Build Windows

on:
  push:
    branches: [main]
    paths: ['app/src/main/assets/www/**', 'web/**', 'desktop/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Version
        run: |
          echo "VERSION_CODE=$(( ($(date +%s) - 1767225600) / 60 ))" >> $GITHUB_ENV
          echo "VERSION_NAME=1.4.$(TZ=Europe/Berlin date +%m%d.%H%M)" >> $GITHUB_ENV

      - name: Install
        working-directory: desktop
        run: |
          npm pkg set version=1.4.$VERSION_CODE
          npm install --no-audit --no-fund

      - name: Build page (players inlined, works offline)
        working-directory: desktop
        run: |
          pip install pillow
          OSSI_LIBS=node_modules python ../web/build.py app/index.html

      - name: Build installer
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: OssiTV-Windows
          path: |
            desktop/dist/OssiTV-Setup.exe
            desktop/dist/OssiTV-Portable.exe

      # Fixed tag "windows" -> the download link never changes. Not marked latest (the Android updater uses latest).
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows --yes --cleanup-tag || true
          gh release create windows desktop/dist/OssiTV-Setup.exe desktop/dist/OssiTV-Portable.exe \
            --target "$GITHUB_SHA" --latest=false \
            --title "Ossi TV für Windows $VERSION_NAME" \
            --notes "OssiTV-Setup.exe: installieren (Desktop-Symbol). OssiTV-Portable.exe: ohne Installation starten."
