name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -A "Mozilla/5.0" "https://www.beinsports.com.tr/yayin-akisi" > b.html
          python3 - <<'PY'
          import re,json
          s=open('b.html').read()
          d=json.loads(re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>',s,re.S).group(1))
          pp=d['props']['pageProps']
          for k in ('days','activeLeagues','selectedRewriteId','selectedDay','query'):
            print('F',k,json.dumps(pp.get(k),ensure_ascii=False)[:1500])
          print('Q',json.dumps(d.get('query'),ensure_ascii=False))
          dt=pp['data']; print('DATAKEYS',list(dt.keys()))
          for k in dt:
            if k!='listTvGuides': print('D',k,json.dumps(dt[k],ensure_ascii=False)[:1500])
          L=dt['listTvGuides']; print('N',len(L),'channels',sorted(set(x['channel_id'] for x in L)))
          for x in L: print('G',x['channel_id'],x['event_date'][:10],x['event_time'],x['name'],x.get('is_week_match'),x.get('related_match_id'))
          PY
          for u in "yayin-akisi/beinsports2" "yayin-akisi/2" "yayin-akisi/bein-sports-2" "yayin-akisi/beIN-SPORTS-2"; do curl -s -o /dev/null -w "U $u %{http_code} %{size_download}\n" -A "Mozilla/5.0" "https://www.beinsports.com.tr/$u"; done
