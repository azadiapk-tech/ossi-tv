name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -A "Mozilla/5.0" "https://www.beinsports.com.tr/yayin-akisi" > b.html
          python3 - <<'PY'
          import re,json
          s=open('b.html').read()
          m=re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>',s,re.S)
          print('NEXT', bool(m))
          if m:
            d=json.loads(m.group(1)); print('KEYS',list(d.keys()), 'page',d.get('page'),'buildId',d.get('buildId'))
            pp=d.get('props',{}).get('pageProps',{}); print('PP',list(pp.keys())[:30])
            t=json.dumps(pp,ensure_ascii=False); print('PPLEN',len(t)); print('PPS',t[:1500])
            for w in ('Süper Lig','Gaziantep','Fenerbah','Eyüp','beIN SPORTS 1'):
              i=t.find(w); print('FIND',w,i, t[max(0,i-300):i+300] if i>=0 else '')
          print('APIS',sorted(set(re.findall(r'https?://[a-zA-Z0-9.-]*(?:api|epg|guide)[a-zA-Z0-9./_-]*',s)))[:30])
          print('SCRIPTS',re.findall(r'src="(/_next/static/[^"]+)"',s)[:40])
          PY
