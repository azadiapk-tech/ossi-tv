name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Mobile Safari/537.36'
          for u in tvdebugun/ tvde-bugun tvde-bugun-futbol tvde-bugun-diger; do
            curl -s -L -o "p.html" -w "U $u %{http_code} %{size_download} %{url_effective}\n" -A "$UA" "https://www.sporx.com/$u"
            python3 - "$u" <<'PY'
          import re,sys,html
          s=open('p.html',encoding='utf-8',errors='replace').read()
          t=re.sub(r'<script[\s\S]*?</script>|<style[\s\S]*?</style>','',s)
          txt=html.unescape(re.sub(r'<[^>]+>',' | ',t)); txt=re.sub(r'(\s*\|\s*)+',' | ',txt); txt=re.sub(r'\s+',' ',txt)
          i=txt.find('Canlı'); print('T',sys.argv[1],'first Canlı at',i); print('T',txt[max(0,i-1500):i+2500])
          print('NEXT', '__NEXT_DATA__' in s, 'json-ld', s.count('application/ld+json'))
          for m in list(re.finditer(r'Gaziantep|Fenerbah|PSG|Lorient|S Sport|beIN SPORTS MAX|TRT Spor',s))[:6]:
            print('RAW',m.group(0),'::',s[max(0,m.start()-400):m.start()+300].replace('\n',' '))
          PY
          done
