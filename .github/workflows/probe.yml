name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir out; D=$(TZ=Europe/Berlin date +%Y%m%d)
          for c in esp.1 eng.1 ger.1 ita.1 fra.1 tur.1; do curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/$c/scoreboard?dates=$D&lang=ar&region=sa" > out/espn_$c.json; done
          for c in beinsports beinsports-2 beinsports-3 beinsports-4 bein-sports-haber; do curl -s -A "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Mobile Safari/537.36" "https://www.beinsports.com.tr/yayin-akisi/$c" > out/$c.html; done
          node .probe/ttr.js
