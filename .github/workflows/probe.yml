name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          E1=$(TZ=Europe/Berlin date +%Y%m%d)
          curl -s --compressed "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/scoreboard?dates=$E1&lang=ar&region=sa" > e.json
          python3 - <<'PY'
          import json
          d=json.load(open('e.json')); L=(d.get('leagues') or [{}])[0]
          print('LKEYS',sorted(L.keys()))
          for k in ('calendarType','calendarIsWhitelist','calendarStartDate','calendarEndDate'): print('L',k,L.get(k))
          cal=L.get('calendar') or []
          print('CAL n',len(cal),'type',type(cal[0]).__name__ if cal else None)
          print('CAL sample',json.dumps(cal[:3])[:600])
          fut=[c for c in cal if isinstance(c,str) and c>='2026-11-28']
          print('CAL future',fut[:12])
          PY
          curl -s --compressed "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard?dates=$E1" > e2.json
          python3 -c "
          import json;d=json.load(open('e2.json'));L=(d.get('leagues') or [{}])[0];cal=L.get('calendar') or []
          print('ENG CAL n',len(cal),[c for c in cal if isinstance(c,str) and c>='2026-11-28'][:6])"
