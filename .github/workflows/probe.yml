name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir out
          for k in 0 1; do
          D=$(TZ=Europe/Berlin date -d "+$k day" +%Y%m%d); D2=$(TZ=Europe/Berlin date -d "+$k day" +%d/%m/%Y)
          for c in esp.1 eng.1 ger.1 ita.1 fra.1 tur.1; do curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/$c/scoreboard?dates=$D&lang=ar&region=sa" > out/espn_$c.json; done
          curl -s -A "Mozilla/5.0" "https://webws.365scores.com/web/games/allscores/?appTypeId=5&langId=27&userCountryId=131&timezoneName=Europe%2FBerlin&sports=1&startDate=$D2&endDate=$D2&showOdds=false" > out/s365.json
          node .probe/tmatch.js
          done
