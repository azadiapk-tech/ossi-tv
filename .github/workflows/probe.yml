name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          mkdir out; D=$(TZ=Europe/Berlin date +%Y%m%d)
          for c in esp.1 eng.1 ger.1 ita.1 fra.1 tur.1; do curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/$c/scoreboard?dates=$D&lang=ar&region=sa" > out/espn_$c.json; done
          curl -s -L -D out/h.txt -o out/sx.html -A "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Mobile Safari/537.36" "https://www.sporx.com/tvde-bugun-futbol"
          grep -i "^content-type" out/h.txt | tail -1 > out/sx.ct; cat out/sx.ct
          node .probe/tsx.js
          curl -s -L -o /dev/null -w "desktopUA %{http_code} %{size_download} %{url_effective}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36" "https://www.sporx.com/tvde-bugun-futbol"
