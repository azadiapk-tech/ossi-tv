/* ---------- playback ---------- */
function playChannel(c, full) {
  S.playing = c; S.zapList = S.view.indexOf(c) > -1 ? S.view : (S.zapList.indexOf(c) > -1 ? S.zapList : [c]);
  S.zapIdx = S.zapList.indexOf(c);
  Pl.playLive(c, full ? FULLR() : PREVR());
  drawInfo(); if (!S.full) drawPrev(); G.ch.draw();
}
function pushPui() { O.pui.setLive(S.playing, S.zapIdx + 1, S.cur ? S.cur.name : ''); O.pui.refresh(); }
function activate(i) {
  var c = S.view[i]; if (!c) return;
  if (S.edit) { toggleSel(c); return; }
  if (S.pick) { var cb = S.pick; S.pick = null; cb(c); return; }
  if (S.overlay) { playChannel(c, true); closeOverlay(); pushPui(); return; }
  var same = S.playing && key(S.playing) === key(c) && Pl.kind === 'live' && Pl.st !== 'idle' && Pl.st !== 'error';
  if (same) { enterFull(); return; }
  if (!O.cfg.get('preview', true)) { playChannel(c, true); enterFull(); return; }
  playChannel(c, false);
}
function enterFull() {
  S.full = true; root.classList.add('hidden');
  Pl.setRect(FULLR());
  O.pui.enter('live', {
    back: exitFull, zap: zap, ok: openOverlay,
    archive: function () { var ch = S.playing; if (!ch || !ch.arch) { O.toast(t('noArchive')); return; } exitFull(); openArchive(ch); },
    hasArchive: function () { return !!(S.playing && S.playing.arch); },
    fav: function () { if (S.playing) toggleFav(S.playing); },
    isFav: function () { return !!(S.playing && O.fav.has('live', S.playing.id)); }
  });
  pushPui();
}
function exitFull() {
  clearTimeout(zapT);
  O.pui.exit(); S.full = false; root.classList.remove('hidden'); root.classList.remove('overlay'); S.overlay = false;
  if (O.cfg.get('preview', true) && Pl.st !== 'idle') Pl.setRect(PREVR()); else { Pl.stop(); S.playing = null; }
  var i = S.view.indexOf(S.playing);
  setArea('channels'); G.cats.draw(); drawCh(); if (i > -1) G.ch.setCur(i);
  drawPrev(); drawInfo();
}
function zap(dir) {
  var L = S.zapList; if (!L.length) return;
  S.zapIdx = (S.zapIdx + dir + L.length) % L.length;
  S.playing = L[S.zapIdx]; pushPui();
  clearTimeout(zapT); Pl.stop(); O.pui.spin(true);
  var c = S.playing;
  zapT = setTimeout(function () { if (S.playing === c) { Pl.playLive(c, FULLR()); pushPui(); } }, 350);
}
function openOverlay() {
  O.pui.touch(false);
  S.overlay = true; root.classList.add('overlay'); root.classList.remove('hidden');
  setArea('channels'); G.cats.draw(); drawCh();
  var i = S.view.indexOf(S.playing); if (i > -1) G.ch.setCur(i);
}
function closeOverlay() { O.pui.touch(true); S.overlay = false; root.classList.remove('overlay'); root.classList.add('hidden'); }

function toggleFav(c) {
  var keep = G.ch.cur;
  var on = O.fav.toggle('live', { id: c.id, name: c.name, icon: c.icon, cat: c.cat });
  O.toast(on ? t('favAdded') : t('favRemoved'));
  refreshCounts();
  if (S.cur && S.cur.type === 'fav' && !on) loadList(S.cur, false, keep); else { G.ch.draw(); G.cats.draw(); }
}

/* ---------- edit mode (RED long-press) ---------- */
function editArr() {
  return S.edit.area === 'channels' ? S.all : S.cats.slice(PSEUDO);
}
function editGrid() { return S.edit.area === 'channels' ? G.ch : G.cats; }
function isTouch() { return document.documentElement.className.indexOf('touch') > -1; }
/* remote edit bar: select mode -> move mode */
O.editBarHtml = function (mode) {
  function k(cls, txt) { return '<span>' + (cls ? '<i class="kd ' + cls + '"></i>' : '') + esc(txt) + '</span>'; }
  return mode === 'move'
    ? k('', '▲ ▼  ' + t('eMoveUD')) + k('w', t('eOkDrop')) + k('', '↩  ' + t('eBackCancel'))
    : k('w', t('eSel')) + k('', '☰  ' + t('eMenuMove')) + k('', '↩  ' + t('eBackCancel'));
};
function drawEditBar() { if (S.edit) $('lvEdit').innerHTML = O.editBarHtml(S.edit.mode); }
function showEditBar(on) {
  drawEditBar();
  $('lvEdit').classList.toggle('hidden', !on || isTouch()); $('lvEditT').classList.toggle('hidden', !on || !isTouch());
  root.querySelector('.lv-hint').style.display = on ? 'none' : '';
}
function enterEdit() {
  if (S.full || S.overlay || S.edit || S.pick) return;
  var a = S.area;
  if (a !== 'channels' && a !== 'cats') { O.toast(t('editFocus')); return; }
  if (a === 'channels') {
    if (!S.cur || S.cur.type === 'recent') { O.toast(t('editRecent')); return; }
    if (S.qh) { O.toast(t('clearSearch')); return; }
    if (!S.all.length) return;
  } else if (S.qc) { O.toast(t('clearSearch')); return; }
  S.edit = { area: a, sel: {}, dirty: false, orig: null, mode: 'select' };
  S.edit.orig = editArr().slice();
  showEditBar(true); G.ch.draw(); G.cats.draw();
  if (!isTouch()) O.toast(t('editOn'));
}
function toggleSel(c) {
  if (c.type && c.type !== 'cat') { O.toast(t('noMove')); return; }
  var k = key(c); if (S.edit.sel[k]) delete S.edit.sel[k]; else S.edit.sel[k] = 1;
  (S.edit.area === 'channels' ? G.ch : G.cats).draw();
}
function writeBack(arr) {
  if (S.edit.area === 'channels') { S.all = arr; S.view = arr; }
  else { S.cats = S.cats.slice(0, PSEUDO).concat(arr); S.catView = S.cats; }
}
function editDrop() {
  var E = S.edit, grid = editGrid(), arr = editArr(), base = E.area === 'channels' ? 0 : PSEUDO;
  var f = grid.cur - base;
  if (f < 0 || f >= arr.length) { O.toast(t('dropHere')); return; }
  if (!Object.keys(E.sel).length) { O.toast(t('selectFirst')); return; }
  var focus = arr[f];
  if (E.sel[key(focus)]) { O.toast(t('dropOther')); return; }
  var block = [], rest = [], minIdx = 1e9;
  arr.forEach(function (x, i) { if (E.sel[key(x)]) { block.push(x); if (i < minIdx) minIdx = i; } else rest.push(x); });
  var fi = rest.indexOf(focus), pos = minIdx > f ? fi : fi + 1;
  var out = rest.slice(0, pos).concat(block, rest.slice(pos));
  writeBack(out); E.sel = {}; E.dirty = true;
  grid.draw(); grid.setCur(out.indexOf(block[0]) + base);
  O.toast(t('moved'));
}
function exitEdit() { S.edit = null; showEditBar(false); root.classList.remove('moving'); G.ch.draw(); G.cats.draw(); }
/* ----- remote: ☰ lifts the selection, ▲▼ move it, OK drops + saves ----- */
function startMove() {
  var E = S.edit, grid = editGrid(), arr = editArr(), base = E.area === 'channels' ? 0 : PSEUDO;
  if (!Object.keys(E.sel).length) {
    var c = arr[grid.cur - base];
    if (!c) { O.toast(t('noMove')); return; }
    E.sel[key(c)] = 1;
  }
  var block = [], rest = [], pos = -1;
  arr.forEach(function (x) { if (E.sel[key(x)]) { if (pos < 0) pos = rest.length; block.push(x); } else rest.push(x); });
  E.mode = 'move'; E.block = block; E.rest = rest; E.pos = pos;
  root.classList.add('moving');
  applyMove(); drawEditBar();
}
function applyMove() {
  var E = S.edit, grid = editGrid(), base = E.area === 'channels' ? 0 : PSEUDO;
  writeBack(E.rest.slice(0, E.pos).concat(E.block, E.rest.slice(E.pos)));
  grid.draw(); grid.setCur(E.pos + base);
}
function moveBy(d) {
  var E = S.edit, np = O.clamp(E.pos + d, 0, E.rest.length);
  if (np === E.pos) return;
  E.pos = np; E.dirty = true; applyMove();
}
function editSave() {
  var E = S.edit;
  if (E.area === 'channels') O.store.ps('order.ch.' + S.cur.id, S.all.map(function (c) { return c.id; }));
  else O.store.ps('order.cats.live', S.cats.slice(PSEUDO).map(function (c) { return c.id; }));
  exitEdit(); O.toast(t('orderSaved'));
}
function editCancel() {
  var E = S.edit; writeBack(E.orig.slice()); exitEdit();
}
function editReset() {
  O.modal.confirm(t('resetOrder'), t('resetOrderMsg'), function () {
    if (S.edit.area === 'channels') { O.store.pd('order.ch.' + S.cur.id); var c = S.cur; exitEdit(); loadList(c, false); }
    else { O.store.pd('order.cats.live'); exitEdit(); buildCats(); G.cats.reset(); G.cats.draw(); }
    O.toast(t('orderReset'));
  }, null, true);
}
/* ----- touch: long-press selects, long-press on a selection drags it, drop saves ----- */
function longPress(area, i) {
  if (S.edit || S.full || S.pick) return;
  setArea(area);
  (area === 'channels' ? G.ch : G.cats).cur = i;
  enterEdit();
  if (!S.edit) return;
  var c = area === 'channels' ? S.view[i] : S.catView[i];
  if (c && (!c.type || c.type === 'cat')) toggleSel(c);
}
function dragStart(area, i) {
  var E = S.edit; if (!E || E.area !== area) return false;
  var c = area === 'channels' ? S.view[i] : S.catView[i];
  if (!c || (c.type && c.type !== 'cat')) return false;
  if (!E.sel[key(c)]) toggleSel(c);
  return Object.keys(E.sel).length > 0;
}
function dropAt(slot) {
  var E = S.edit; if (!E || !Object.keys(E.sel).length) return;
  var arr = editArr(), base = E.area === 'channels' ? 0 : PSEUDO, sl = O.clamp(slot - base, 0, arr.length);
  var block = [], rest = [], before = 0;
  arr.forEach(function (x, i) { if (E.sel[key(x)]) block.push(x); else { rest.push(x); if (i < sl) before++; } });
  var out = rest.slice(0, before).concat(block, rest.slice(before));
  writeBack(out); E.sel = {}; E.dirty = true;
  editSave();
}

/* ----- catch-up (archive) ----- */
function dayKey(ms) { var d = new Date(ms); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
function dayLabel(ms) {
  var k = dayKey(ms);
  if (k === dayKey(Date.now())) return t('today');
  if (k === dayKey(Date.now() - 86400000)) return t('yesterday');
  var loc = { ar: 'ar', en: 'en-GB', de: 'de-DE' }[O.lang()] || 'en-GB';
  try { return new Date(ms).toLocaleDateString(loc, { weekday: 'long', day: 'numeric', month: 'long' }); } catch (e) { return new Date(ms).toDateString(); }
}
function openArchive(ch) {
  if (!ch || !ch.arch) { O.toast(t('noArchive')); return; }
  O.toast(t('loading'));
  D.archive(ch.id, function (list) {
    var now = Date.now(), from = now - ch.arch * 86400000 - 3600000;
    var items = list.filter(function (x) { return x.e < now && x.s > from; });
    if (list.some(function (x) { return x.arch; })) items = items.filter(function (x) { return x.arch; });
    if (!items.length) { O.toast(t('noArchive')); return; }
    var days = {}, order = [];
    items.forEach(function (x) { var k = dayKey(x.s); if (!days[k]) { days[k] = []; order.push(k); } days[k].push(x); });
    order.reverse();
    O.modal.list(t('archive') + ' • ' + ch.name, function () {
      return order.map(function (k) {
        var l = days[k];
        return { label: dayLabel(l[0].s), value: String(l.length), onOk: function () { showDay(ch, l.slice().reverse()); } };
      });
    });
  }, function () { O.toast(t('loadFail')); });
}
function showDay(ch, progs) {
  O.modal.list(dayLabel(progs[0].s), function () {
    return progs.map(function (x) {
      return { label: O.fmtHM(x.s) + '   ' + (x.title || '—'), onOk: function () { O.modal.closeAll(); playArchive(ch, x); } };
    });
  });
}
function playArchive(ch, x) {
  var dur = Math.max(1, Math.ceil((x.e - x.s) / 60000));
  var st = x.start;
  if (!st) { var d = new Date(x.s), z = function (n) { return (n < 10 ? '0' : '') + n; }; st = d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()); }
  var url = O.api.timeshift(ch.id, st, dur);
  if (!url) { O.toast(t('playFail')); return; }
  Pl.stop(); S.playing = null; root.classList.add('hidden');
  O.vodPlay({
    title: x.title || ch.name, sub: ch.name + '  •  ' + dayLabel(x.s) + '  ' + O.fmtHM(x.s) + ' – ' + O.fmtHM(x.e),
    url: url, startMs: 0, posKey: 'arch:' + ch.id + ':' + x.s, item: ch,
    onExit: function () { root.classList.remove('hidden'); setArea('channels'); drawPrev(); drawInfo(); G.ch.draw(); }
  });
}

Live.onRed = function (kind) {
  if (kind === 'long') enterEdit();
  else if (kind === 'save' && S.edit) editSave();
};
Live.editing = function () { return !!S.edit; };
/* long OK in a list = start selecting (same as ☰) */
Live.canLongOk = function () { return !S.edit && !S.full && !S.overlay && !S.pick && (S.area === 'channels' || S.area === 'cats'); };
Live.onLongOk = function () { longPress(S.area, (S.area === 'channels' ? G.ch : G.cats).cur); };

/* ---------- keys ---------- */
function back() {
  if (S.edit) {
    if (S.edit.dirty) O.modal.confirm(t('discardTitle'), t('discardMsg'), editCancel, null, true); else editCancel();
    return;
  }
  if (S.overlay) { closeOverlay(); return; }
  if (S.pick) { S.pick = null; O.app.go('multi'); return; }
  O.app.back();
}
Live.overlayOpen = function () { return S.overlay; };
Live.fullOpen = function () { return S.full; };
Live.onKey = function (e, k) {
  var E = S.edit, used = true, a = S.area;
  if (k === K.BACK || k === K.ESC) { back(); e.preventDefault(); return true; }
  if (E && E.mode === 'move') {
    var vis = editGrid().vis();
    if (k === K.UP) moveBy(-1); else if (k === K.DOWN) moveBy(1);
    else if (k === K.PGUP || k === K.CHDN) moveBy(-vis); else if (k === K.PGDN || k === K.CHUP) moveBy(vis);
    else if (k === K.ENTER || k === K.RED) editSave();
    e.preventDefault(); return true;
  }
  if (k === K.MENU) {
    if (!E) { if (!S.overlay && !S.full) enterEdit(); }
    else startMove();
    e.preventDefault(); return true;
  }
  if (k === K.GREEN) { if (E) editDrop(); e.preventDefault(); return true; }
  if (k === K.YELLOW) {
    if (!E && a === 'channels' && S.view[G.ch.cur]) toggleFav(S.view[G.ch.cur]);
    e.preventDefault(); return true;
  }
  if (k === K.BLUE) { if (E) editReset(); else if (!S.overlay) openArchive(S.playing || S.view[G.ch.cur]); e.preventDefault(); return true; }

  if (a === 'catSearch' || a === 'chSearch') {
    if (k === K.DOWN) setArea(a === 'catSearch' ? 'cats' : 'channels');
    else if (k === K.RIGHT && a === 'catSearch') setArea('chSearch');
    else if (k === K.LEFT && a === 'chSearch') setArea('catSearch');
    else if (k === K.ENTER) $(a === 'catSearch' ? 'lvCatQ' : 'lvChQ').focus();
    else used = false;
  } else if (a === 'cats') {
    if (k === K.UP) { if (!G.cats.move(0, -1) && !E) setArea('catSearch'); }
    else if (k === K.DOWN) G.cats.move(0, 1);
    else if (k === K.RIGHT) { if (E && E.area === 'cats') editDrop(); else if (S.view.length) setArea('channels'); }
    else if (k === K.ENTER) { if (S.retry && !S.cats.length) S.retry(); else onCatOk(); }
    else if (k === K.PGUP || k === K.CHDN) G.cats.page(-1);
    else if (k === K.PGDN || k === K.CHUP) G.cats.page(1);
    else used = false;
  } else if (a === 'channels') {
    if (k === K.UP) { if (!G.ch.move(0, -1) && !E) setArea('chSearch'); }
    else if (k === K.DOWN) G.ch.move(0, 1);
    else if (k === K.LEFT) { if (!E || E.area !== 'channels') setArea('cats'); }
    else if (k === K.RIGHT) {
      if (E && E.area === 'channels') editDrop();
      else if (!S.overlay && !E && !S.pick) setArea('preview');
    }
    else if (k === K.ENTER) { if (S.retry && !S.view.length) S.retry(); else activate(G.ch.cur); }
    else if (k === K.PGUP || k === K.CHDN) G.ch.page(-1);
    else if (k === K.PGDN || k === K.CHUP) G.ch.page(1);
    else used = false;
    if (used && (k === K.UP || k === K.DOWN)) { clearTimeout(infoT); infoT = setTimeout(drawInfo, 160); }
  } else if (a === 'preview') {
    if (k === K.LEFT) setArea('channels');
    else if (k === K.ENTER) { if (S.playing && Pl.st !== 'idle') enterFull(); }
    else used = false;
  }
  if (used) e.preventDefault();
  return used;
};
Live.gotoNumber = function (n) {
  var L = (S.full || S.overlay) ? S.zapList : S.view;
  if (!(n >= 1 && n <= L.length)) { O.toast(t('noChannelNo')); return; }
  if (S.full || S.overlay) {
    S.zapIdx = n - 1; playChannel(L[n - 1], true); if (S.overlay) closeOverlay(); pushPui();
  } else { setArea('channels'); G.ch.setCur(n - 1); drawInfo(); }
};

/* ---------- lifecycle ---------- */
Live.show = function (arg) {
  if (!built) build();
  shown = true; S.full = false; S.overlay = false;
  S.pick = arg && arg.pick ? arg.pick : null;
  root.classList.remove('hidden'); root.classList.remove('overlay');
  $('lvPrev').style.display = S.pick ? 'none' : '';
  $('lvInfo').style.display = S.pick ? 'none' : '';
  if (!S.cats.length) {
    S.loading = true; drawCh();
    D.getCats('live', function () {
      buildCats();
      var last = O.store.p('last.live', null), ent = null;
      if (last) S.cats.forEach(function (c) { if (c.id === last.cat) ent = c; });
      if (!ent) ent = S.cats[PSEUDO] || S.cats[2];
      G.cats.draw();
      openCat(ent, true);
      setTimeout(function () {
        D.loadAllLive(function () { refreshCounts(); if (shown) G.cats.draw(); });
      }, 1500);
    }, function (err) {
      S.loading = false; S.err = err; drawCh();
      S.retry = function () { S.err = null; Live.show(); };
    });
    setArea('cats');
  } else {
    refreshCounts(); G.cats.draw(); drawCh(); drawPrev(); drawInfo();
    setArea(S.view.length ? 'channels' : 'cats');
  }
  drawPrev();
};
Live.hide = function () {
  shown = false; clearTimeout(zapT);
  if (S.edit) { S.edit = null; showEditBar(false); }
  if (!S.pick) { Pl.stop(); S.playing = null; }
  if (root) root.classList.add('hidden');
};
Live.relang = function () { built = false; S.cats = []; S.catView = []; S.cur = null; S.all = []; S.view = []; };
Live.refreshData = function () { S.cats = []; S.catView = []; S.cur = null; S.all = []; S.view = []; };
})();

</script>
<script>
/* vod.js */
/* Movies + Series poster grids, series detail (seasons / episodes) and the shared VOD player controller. */
(function () {
'use strict';
var O = window.O, $ = O.$, esc = O.esc, t = O.t, K = O.K, D = O.data, Pl = O.player;
function FULLR() { return { x: 0, y: 0, w: O.stageW || 1920, h: 1080 }; }

/* ================= shared VOD player controller ================= */
var VP = null, lastSave = 0;
O.vodPlay = function (o) {
  VP = o; lastSave = 0;
  Pl.playVod({ url: o.url, startMs: o.startMs || 0, item: o.item }, FULLR());
  O.pui.enter('vod', {
    back: vodExit,
    fav: o.favType && o.item ? function () { var on = O.fav.toggle(o.favType, slimItem(o.item)); O.toast(on ? t('favAdded') : t('favRemoved')); } : null,
    isFav: o.favType && o.item ? function () { return O.fav.has(o.favType, o.item.id); } : null
  });
  O.pui.setVod(o.title, o.sub);
  if (o.startMs > 0) O.toast(t('resumeAt') + ' ' + O.fmtDur(o.startMs));
};
function vodExit() {
  if (!VP) return;
  var o = VP; VP = null;
  if (Pl.time > 0) O.pos.set(o.posKey, Pl.time, Pl.dur);
  Pl.stop(); O.pui.exit();
  if (o.onExit) o.onExit();
}
O.vodActive = function () { return !!VP; };
Pl.on(function (ev, a) {
  if (!VP) return;
  if (ev === 'time') { if (Date.now() - lastSave > 10000) { lastSave = Date.now(); O.pos.set(VP.posKey, a, Pl.dur); } }
  else if (ev === 'ended') {
    O.pos.set(VP.posKey, 0, Pl.dur);
    if (VP.onEnd) { var o = VP; VP = null; Pl.stop(); o.onEnd(); } else vodExit();
  }
});

/* ================= grid screens ================= */
function rating(r) { var n = parseFloat(r); return n > 0 ? n.toFixed(1) : ''; }
function initials(name) {
  var n = String(name).replace(/^[^:]*:\s*/, '').replace(/[^\w؀-ۿ]/g, '');
  return (n || 'TV').slice(0, 2).toUpperCase();
}
function slimItem(c) { return { id: c.id, name: c.name, icon: c.icon, cat: c.cat, rating: c.rating, ext: c.ext }; }

function makeVod(type, rootId) {
  var root = null, built = false, G = {}, searchT = 0, shown = false;
  var S = { cats: [], catView: [], cur: null, all: [], view: [], area: 'grid', qc: '', qh: '', tok: 0, loading: false, err: null, retry: null, edit: null };
  var PS = 2;   /* pseudo categories (continue, favourites) at the top */
  var scr = {};

  function q(sel) { return root.querySelector(sel); }
  function build() {
    root = $(rootId);
    root.innerHTML =
      '<div class="hdr"></div>' + O.brandBack(t(type === 'movie' ? 'movies' : 'series')) +
      '<div class="sbox vd-search">' + O.ic.search + '<input class="vq" placeholder="' + esc(t(type === 'movie' ? 'searchMovies' : 'searchSeries')) + '"></div>' +
      '<div class="hbtn" data-go="home" style="left:1700px;margin-left:var(--X,0px)">' + O.ic.home + '</div><div class="hbtn" data-go="settings" style="left:1790px;margin-left:var(--X,0px)">' + O.ic.gear + '</div>' +
      '<div class="pane lv-cats" style="background:rgba(4,10,26,.55)"></div>' +
      '<div class="sbox vcs" style="left:20px;top:140px;width:520px">' + O.ic.search + '<input class="vc" placeholder="' + esc(t('searchCat')) + '"></div>' +
      '<div class="lv-list vd-cats"></div><div class="lv-list vd-grid"></div>' +
      '<div class="hints"><span><i class="kd w"></i>OK</span><span><i class="kd y"></i>' + esc(t('hFav')) + '</span><span>☰  ' + esc(t('eTitle2')) + '</span></div>' +
      '<div class="editbar hidden vd-edit"></div>';
    G.cats = new O.VGrid(q('.vd-cats'), {
      cols: 1, itemH: 74, gap: 8, render: catRow, count: function () { return S.catView.length; },
      onClick: function (i) { if (S.edit) { if (S.edit.area === 'cats' && S.edit.mode === 'select') eToggle(i); return; } setArea('cats'); onCatOk(); }
    });
    G.grid = new O.VGrid(q('.vd-grid'), {
      cols: 5 + Math.round((O.stageX || 0) / 263), itemH: 420, gap: 16, render: card, count: function () { return S.view.length; },
      onClick: function (i, e) {
        if (S.edit) { if (S.edit.area === 'grid' && S.edit.mode === 'select') eToggle(i); return; }
        setArea('grid');
        if (e.target.closest && e.target.closest('.hrt')) toggleFav(S.view[i]); else activate(i);
      }
    });
    root.addEventListener('click', function (e) {
      var g = e.target.closest && e.target.closest('[data-go]');
      if (g) O.app.go(g.getAttribute('data-go'));
    });
    q('.vq').addEventListener('input', function () {
      clearTimeout(searchT); searchT = setTimeout(function () { S.qh = q('.vq').value.toLowerCase().replace(/^\s+|\s+$/g, ''); applyView(); G.grid.reset(); drawGrid(); }, 200);
    });
    q('.vc').addEventListener('input', function () {
      clearTimeout(searchT); searchT = setTimeout(function () { S.qc = q('.vc').value.toLowerCase().replace(/^\s+|\s+$/g, ''); filterCats(); G.cats.reset(); }, 200);
    });
    built = true;
  }
  function catRow(i) {
    var c = S.catView[i], act = S.cur && S.cur.id === c.id, sel = S.edit && S.edit.sel[String(c.id)];
    return '<div class="cat' + (c.type !== 'cat' ? ' pseudo' : '') + (act ? ' act' : '') + (sel ? ' sel' : '') + '" data-i="' + i + '"><span class="nm" dir="auto">' + esc(c.name) + '</span>' +
      (O.par.isLocked(type, c) ? O.ic.lock : '') + '<b>' + (c.count != null ? c.count : '') + '</b></div>';
  }
  function card(i) {
    var c = S.view[i], fav = O.fav.has(type, c.id), rt = rating(c.rating), ini = esc(initials(c.name)), pb = '';
    if (type === 'movie') { var p = O.pos.get('movie:' + c.id); if (p && p.d > 0 && p.t > 0) pb = '<div class="pb" style="width:' + Math.min(100, p.t / p.d * 100) + '%"></div>'; }
    var sel = S.edit && S.edit.sel[String(c.id)];
    return '<div class="pc' + (sel ? ' sel' : '') + '" data-i="' + i + '"><div class="pi"><div class="ph">' + ini + '</div>' + (c.icon ? '<img src="' + esc(c.icon) + '" decoding="async">' : '') +
      '</div>' + (rt ? '<span class="rt">' + rt + '</span>' : '') + '<span class="hrt' + (fav ? ' on' : '') + '">' + O.ic.heart + '</span>' + pb +
      '<div class="pn" dir="auto">' + esc(c.name) + '</div></div>';
  }
  function buildCats() {
    var real = O.applyOrder((D.cats[type] || []).map(function (c) { return { id: c.id, name: c.name, type: 'cat' }; }), O.store.p('order.cats.' + type, null), 'id');
    S.cats = [{ id: 'recent', name: t('continue'), type: 'recent' }, { id: 'fav', name: t('favorites'), type: 'fav' }].concat(real);
    refreshCounts(); filterCats();
  }
  function refreshCounts() {
    S.cats.forEach(function (c) {
      if (c.type === 'recent') c.count = O.recent.list(type).length;
      else if (c.type === 'fav') c.count = O.fav.list(type).length;
    });
  }
  function filterCats() {
    var qq = S.qc;
    S.catView = qq ? S.cats.filter(function (c) { return c.name.toLowerCase().indexOf(qq) > -1; }) : S.cats;
  }
  function onCatOk() { var c = S.catView[G.cats.cur]; if (c) openCat(c, true); }
  function openCat(entry, toGrid) { O.par.guard(type, entry, function () { loadList(entry, toGrid); }); }
  function loadList(entry, toGrid, keep) {
    S.cur = entry; S.retry = null; S.qh = ''; q('.vq').value = '';
    O.store.ps('last.' + type, { cat: entry.id });
    var tk = ++S.tok;
    if (entry.type === 'recent') { setAll(O.recent.list(type), toGrid, keep); return; }
    if (entry.type === 'fav') { setAll(O.fav.list(type), toGrid, keep); return; }
    S.loading = true; S.err = null; S.all = []; S.view = []; drawGrid(); G.cats.draw();
    D.getItems(type, entry.id, function (list) { if (tk === S.tok) setAll(O.applyOrder(list, O.store.p('order.' + type + '.' + entry.id, null), 'id'), toGrid, keep); }, function (err) {
      if (tk !== S.tok) return;
      S.loading = false; S.err = err; drawGrid(); S.retry = function () { loadList(entry, toGrid); };
    });
  }
  function setAll(list, toGrid, keep) {
    S.loading = false; S.err = null; S.all = list; applyView(); refreshCounts();
    G.grid.reset(); if (keep) G.grid.setCur(keep);
    drawGrid(); G.cats.draw();
    if (toGrid && S.view.length) setArea('grid');
  }
  function applyView() {
    var qq = S.qh;
    S.view = qq ? S.all.filter(function (c) { return c.name.toLowerCase().indexOf(qq) > -1; }) : S.all;
  }
  function drawGrid() {
    var el = q('.vd-grid');
    if (S.loading) { el.innerHTML = '<div class="loading">' + esc(t('loading')) + '</div>'; return; }
    if (S.err) { el.innerHTML = '<div class="loading">' + esc(t('loadFail')) + '<br>' + esc(t('retryHint')) + '</div>'; return; }
    if (!S.view.length) { el.innerHTML = '<div class="loading">' + esc(t('empty')) + '</div>'; return; }
    G.grid.draw();
  }
  function setArea(a) {
    S.area = a;
    G.cats.setActive(a === 'cats'); G.grid.setActive(a === 'grid');
    q('.vcs').classList.toggle('focus', a === 'catSearch');
    q('.vd-search').classList.toggle('focus', a === 'hdrSearch');
  }
  function toggleFav(c) {
    var keep = G.grid.cur, on = O.fav.toggle(type, slimItem(c));
    O.toast(on ? t('favAdded') : t('favRemoved')); refreshCounts();
    if (S.cur && S.cur.type === 'fav' && !on) loadList(S.cur, false, keep); else { G.grid.draw(); G.cats.draw(); }
  }
  /* ----- re-ordering with the remote: ☰ (or long OK) select, ☰ lift, arrows move, OK drop + save ----- */
  function eArr() { return S.edit.area === 'grid' ? S.all : S.cats.slice(PS); }
  function eGrid() { return S.edit.area === 'grid' ? G.grid : G.cats; }
  function eBase() { return S.edit.area === 'grid' ? 0 : PS; }
  function eBar() { var b = q('.vd-edit'); b.innerHTML = S.edit ? O.editBarHtml(S.edit.mode) : ''; b.classList.toggle('hidden', !S.edit); }
  function eDraw() { G.grid.draw(); G.cats.draw(); }
  function editStart(selectCur) {
    var a = S.area;
    if (a !== 'grid' && a !== 'cats') return;
    if (a === 'grid') {
      if (!S.cur || S.cur.type !== 'cat') { O.toast(t('editRecent')); return; }
      if (S.qh) { O.toast(t('clearSearch')); return; }
      if (!S.all.length) return;
    } else if (S.qc) { O.toast(t('clearSearch')); return; }
    S.edit = { area: a, sel: {}, mode: 'select', orig: null, dirty: false };
    S.edit.orig = eArr().slice();
    if (selectCur) eToggle(eGrid().cur);
    root.classList.add('editing'); eBar(); eDraw();
  }
  function eToggle(i) {
    var c = eArr()[i - eBase()];
    if (!c) { O.toast(t('noMove')); return; }
    var k = String(c.id); if (S.edit.sel[k]) delete S.edit.sel[k]; else S.edit.sel[k] = 1;
    eDraw();
  }
  function eWrite(arr) {
    if (S.edit.area === 'grid') { S.all = arr; applyView(); }
    else { S.cats = S.cats.slice(0, PS).concat(arr); filterCats(); }
  }
  function eLift() {
    var E = S.edit, arr = eArr();
    if (!Object.keys(E.sel).length) { var c = arr[eGrid().cur - eBase()]; if (!c) { O.toast(t('noMove')); return; } E.sel[String(c.id)] = 1; }
    var block = [], rest = [], pos = -1;
    arr.forEach(function (x) { if (E.sel[String(x.id)]) { if (pos < 0) pos = rest.length; block.push(x); } else rest.push(x); });
    E.mode = 'move'; E.block = block; E.rest = rest; E.pos = pos;
    root.classList.add('moving'); eApply(); eBar();
  }
  function eApply() {
    var E = S.edit;
    eWrite(E.rest.slice(0, E.pos).concat(E.block, E.rest.slice(E.pos)));
    eDraw(); eGrid().setCur(E.pos + eBase());
  }
  function eMove(d) {
    var E = S.edit, np = O.clamp(E.pos + d, 0, E.rest.length);
    if (np !== E.pos) { E.pos = np; E.dirty = true; eApply(); }
  }
  function eExit() { S.edit = null; root.classList.remove('editing'); root.classList.remove('moving'); eBar(); eDraw(); }
  function eSave() {
    var E = S.edit;
    if (E.area === 'grid') O.store.ps('order.' + type + '.' + S.cur.id, S.all.map(function (c) { return c.id; }));
    else O.store.ps('order.cats.' + type, S.cats.slice(PS).map(function (c) { return c.id; }));
    eExit(); O.toast(t('orderSaved'));
  }
  function eCancel() { eWrite(S.edit.orig.slice()); eExit(); }
  scr.canLongOk = function () { return !S.edit && (S.area === 'grid' || S.area === 'cats'); };
  scr.onLongOk = function () { editStart(true); };

  function activate(i) {
    var c = S.view[i]; if (!c) return;
    O.app.setParent('detail', type === 'series' ? 'series' : 'movies');
    if (type === 'series') O.app.go('detail', { series: c }); else O.app.go('detail', { movie: c });
  }
  scr.onKey = function (e, k) {
    var a = S.area, used = true, E = S.edit;
    if (E) {
      if (k === K.BACK || k === K.ESC) { eCancel(); O.toast(t('eCancelled')); e.preventDefault(); return true; }
      if (E.mode === 'move') {
        var cols = E.area === 'grid' ? G.grid.cols : 1;
        if (k === K.UP) eMove(-cols); else if (k === K.DOWN) eMove(cols);
        else if (k === K.LEFT) eMove(-1); else if (k === K.RIGHT) eMove(1);
        else if (k === K.ENTER || k === K.RED) eSave();
        e.preventDefault(); return true;
      }
      if (k === K.MENU) { eLift(); e.preventDefault(); return true; }
      if (k === K.ENTER) { eToggle(eGrid().cur); e.preventDefault(); return true; }
      if (k === K.RED) { eSave(); e.preventDefault(); return true; }
      if (E.area === 'grid') {
        if (k === K.UP) G.grid.move(0, -1); else if (k === K.DOWN) G.grid.move(0, 1);
        else if (k === K.LEFT) G.grid.move(-1, 0); else if (k === K.RIGHT) G.grid.move(1, 0);
      } else {
        if (k === K.UP) G.cats.move(0, -1); else if (k === K.DOWN) G.cats.move(0, 1);
      }
      e.preventDefault(); return true;
    }
    if (k === K.MENU) { editStart(false); e.preventDefault(); return true; }
    if (k === K.BACK || k === K.ESC) { O.app.back(); e.preventDefault(); return true; }
    if (k === K.YELLOW) { if (a === 'grid' && S.view[G.grid.cur]) toggleFav(S.view[G.grid.cur]); e.preventDefault(); return true; }
    if (a === 'catSearch') {

/* ---------- speed test ---------- */
function anyLiveId(cb, fail) {
  if (D.liveAll && D.liveAll.length) { cb(D.liveAll[0].id); return; }
  D.getCats('live', function (cats) {
    if (!cats.length) { fail(); return; }
    D.getItems('live', cats[0].id, function (l) { if (l.length) cb(l[0].id); else fail(); }, fail);
  }, fail);
}
function speedTest() {
  var done = false, x = null, tmr = 0;
  var cfg = M.open({ title: t('tSpeed'), msg: t('testing'), rows: [{ label: t('close'), onOk: function () { stop(); M.close(); } }] });
  function stop() { done = true; clearInterval(tmr); try { if (x) x.abort(); } catch (e) {} }
  cfg.onBack = function () { stop(); M.close(); };
  var t0 = Date.now(), ping = null;
  O.getJSON(O.api.url('', ''), function () {
    ping = Date.now() - t0;
    if (done) return;
    anyLiveId(function (id) {
      if (done) return;
      x = new XMLHttpRequest();
      x.open('GET', O.api.stream('live', id, 'ts'), true);
      x.responseType = 'arraybuffer';
      var start = 0, loaded = 0, mbps = 0;
      x.onprogress = function (ev) { if (!start) start = Date.now(); loaded = ev.loaded; };
      function finish() {
        if (done) return; stop();
        var verdict = mbps >= 25 ? t('spd4k') : mbps >= 8 ? t('spdHd') : mbps >= 3 ? t('spdSd') : t('spdLow');
        M.setMsg(t('ping') + ': ' + ping + ' ms\n' + t('speed') + ': ' + mbps.toFixed(1) + ' Mbit/s\n' + verdict);
      }
      x.onerror = function () { if (!loaded) { done = true; M.setMsg(t('testFail')); } else finish(); };
      x.onloadend = function () { if (loaded) finish(); };
      tmr = setInterval(function () {
        if (!start) return;
        var sec = (Date.now() - start) / 1000; if (sec < 0.3) return;
        mbps = loaded * 8 / sec / 1e6;
        if (sec >= 8 || loaded > 30e6) { finish(); return; }
        M.setMsg(t('ping') + ': ' + ping + ' ms\n' + t('speed') + ': ' + mbps.toFixed(1) + ' Mbit/s …');
      }, 500);
      x.send();
    }, function () { if (!done) M.setMsg(t('testFail')); });
  }, function () { if (!done) M.setMsg(t('testFail')); }, 0);
}

/* ================= multi-screen ================= */
var Mu = O.multi = {};
var mu = { root: null, n: 4, slots: [null, null, null, null], pl: [], focus: 0, built: false, errs: [] };
function rects() {
  if (mu.n === 2) return [{ x: 50, y: 270, w: 880, h: 495 }, { x: 990, y: 270, w: 880, h: 495 }];
  var dx = Math.round((O.stageX || 0) / 2);
  return [{ x: 220 + dx, y: 130, w: 720, h: 405 }, { x: 980 + dx, y: 130, w: 720, h: 405 }, { x: 220 + dx, y: 590, w: 720, h: 405 }, { x: 980 + dx, y: 590, w: 720, h: 405 }];
}
function muDraw() {
  var r = rects(), h = '<div class="st-title" style="top:30px;left:56px;font-size:34px" dir="auto">' + esc(t('tMulti')) + '</div>';
  for (var i = 0; i < mu.n; i++) {
    var ch = mu.slots[i], c = r[i], bad = mu.errs[i];
    h += '<div class="mu-cell' + (i === mu.focus ? ' focus' : '') + '" style="left:' + c.x + 'px;top:' + c.y + 'px;width:' + c.w + 'px;height:' + c.h + 'px;' + (ch && !bad ? 'background:transparent;color:transparent' : '') + '">' +
      (ch ? (bad ? esc(t('slotFail')) : '') : '＋ ' + esc(t('pickCh'))) + '</div>' +
      '<div style="position:absolute;left:' + c.x + 'px;top:' + (c.y + c.h + 6) + 'px;width:' + c.w + 'px;font-size:23px;color:#c3d1ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" dir="auto">' + (ch ? esc(ch.name) : '') + '</div>';
  }
  h += '<div class="hints"><span><i class="kd w"></i>OK</span><span><i class="kd y"></i>' + esc(t('mLayout')) + '</span><span><i class="kd g"></i>' + esc(t('mReload')) + '</span></div>';
  mu.root.innerHTML = h;
}
function stopSlots() {
  Pl.stop();
  mu.pl.forEach(function (p) { if (!p) return; try { p.stop(); } catch (e) {} try { p.close(); } catch (e) {} });
}
function startSlots() {
  stopSlots(); mu.errs = [];
  var fmt = O.cfg.get('fmt', 'ts') || 'ts', r = rects();
  for (var i = 0; i < mu.n; i++) (function (i) {
    var ch = mu.slots[i]; if (!ch) return;
    if (i === 0) { Pl.playLive(ch, r[0]); return; }
    try {
      var p = mu.pl[i] || (mu.pl[i] = webapis.avplaystore.getPlayer());
      p.open(O.api.stream('live', ch.id, fmt));
      p.setListener({ onerror: function () { mu.errs[i] = 1; muDraw(); }, onbufferingstart: function () {}, onbufferingprogress: function () {}, onbufferingcomplete: function () {}, oncurrentplaytime: function () {}, onevent: function () {}, onstreamcompleted: function () {} });
      p.setDisplayRect(r[i].x, r[i].y, r[i].w, r[i].h);
      p.prepareAsync(function () { try { p.play(); } catch (e) { mu.errs[i] = 1; muDraw(); } }, function () { mu.errs[i] = 1; muDraw(); });
    } catch (e) { mu.errs[i] = 1; }
  })(i);
  muDraw();
  if (mu.errs.some(Boolean)) O.toast(t('multiUnsupported'));
}
Mu.show = function () {
  mu.root = $('multi'); mu.root.classList.remove('hidden');
  if (!mu.built) {
    mu.root.addEventListener('click', function (e) {
      var c = e.target.closest && e.target.closest('.mu-cell'); if (!c) return;
      mu.focus = Array.prototype.indexOf.call(mu.root.querySelectorAll('.mu-cell'), c); muDraw(); muOk();
    });
    mu.built = true;
  }
  muDraw(); startSlots();
};
Mu.hide = function () { stopSlots(); if (mu.root) mu.root.classList.add('hidden'); };
function muOk() {
  var i = mu.focus;
  if (!mu.slots[i]) { pick(i); return; }
  M.list(mu.slots[i].name, function () {
    return [
      { label: t('changeCh'), onOk: function () { M.close(); pick(i); } },
      { label: t('removeCh'), onOk: function () { mu.slots[i] = null; M.close(); startSlots(); } },
      { label: t('close'), onOk: M.close }
    ];
  });
}
function pick(i) {
  O.app.go('live', { pick: function (ch) { mu.slots[i] = { id: ch.id, name: ch.name }; O.app.go('multi'); } });
}
Mu.onKey = function (e, k) {
  var used = true, cols = 2;
  if (k === K.BACK || k === K.ESC) O.app.go('settings');
  else if (k === K.LEFT) { if (mu.focus % cols) mu.focus--; muDraw(); }
  else if (k === K.RIGHT) { if (mu.focus % cols < cols - 1 && mu.focus < mu.n - 1) mu.focus++; muDraw(); }
  else if (k === K.UP) { if (mu.focus >= cols) mu.focus -= cols; muDraw(); }
  else if (k === K.DOWN) { if (mu.focus + cols < mu.n) mu.focus += cols; muDraw(); }
  else if (k === K.ENTER) muOk();
  else if (k === K.YELLOW) { mu.n = mu.n === 4 ? 2 : 4; mu.focus = 0; startSlots(); }
  else if (k === K.GREEN) startSlots();
  else used = false;
  if (used) e.preventDefault();
  return used;
};
Mu.relang = function () {};
})();

<script>
/* home.js */
/* Home screen: 4 big tiles, "continue watching" row, clock, playlist badge. */
(function () {

  { go: 'series', l: 'series', s: 'seriesSub', i: svg('<rect x="14" y="6" width="44" height="36" rx="5" fill="#e040fb"/><path d="M30 14v20l16-10z" fill="#fff"/><path d="M6 16v34a5 5 0 005 5h33" stroke="#e040fb" stroke-width="5" fill="none" stroke-linecap="round"/>') },
  { go: 'settings', l: 'settings', s: 'settingsSub', i: svg('<circle cx="32" cy="32" r="14" fill="none" stroke="#5ef0a8" stroke-width="9"/><circle cx="32" cy="32" r="26" fill="none" stroke="#5ef0a8" stroke-width="9" stroke-dasharray="7.2 7.2"/>') }
];
var H = O.home = {}, root, built = false, idx = 0, clockT = 0, area = 'tiles', ci = 0, cont = [];

function build() {

/* ----- continue watching: recent movies + series, newest first ----- */
function contItems() {
  var out = [];
  O.recent.list('movie').forEach(function (it) {
    var p = O.pos.get('movie:' + it.id);
    if (p && p.d > 0 && p.t === 0) return;                 /* finished */
    out.push({ k: 'movie', it: it, ts: it.ts || 0, pct: p && p.d > 0 ? p.t / p.d * 100 : 0, sub: p && p.d > 0 ? t('left') + ' ' + O.fmtDur(p.d - p.t) : '' });
  });

function drawCont() {
  cont = contItems();
  root.classList.toggle('nocont', !cont.length);
  var h = '';
  cont.forEach(function (c, i) {
    var ini = esc(String(c.it.name || '').replace(/^[^:]*:\s*/, '').slice(0, 2));
    h += '<div class="cc" data-c="' + i + '"><div class="ci"><div class="ph">' + ini + '</div>' + (c.it.icon ? '<img src="' + esc(c.it.icon) + '" decoding="async" onerror="this.style.display=\'none\'">' : '') +
      '<span class="ck">' + (c.k === 'movie' ? '🎬' : '📺') + '</span>' + (c.pct > 0 ? '<div class="pb" style="width:' + Math.min(100, c.pct).toFixed(1) + '%"></div>' : '') + '</div>' +
      '<div class="cn" dir="auto">' + esc(c.it.name) + '</div><div class="cs" dir="auto">' + esc(c.sub) + '</div></div>';
  });
  $('hCont').innerHTML = h;
  if (ci >= cont.length) ci = Math.max(0, cont.length - 1);
  if (!cont.length && area === 'cont') area = 'tiles';
}
function openCont(i) {
  var c = cont[i]; if (!c) return;
  O.app.setParent('detail', 'home');
  if (c.k === 'movie') O.app.go('detail', { movie: c.it }); else O.app.go('detail', { series: c.it });
}
function paint() {
  var els = root.querySelectorAll('.tile');
  for (var i = 0; i < els.length; i++) els[i].classList.toggle('focus', area === 'tiles' && i === idx);
  root.classList.toggle('in-cont', area === 'cont');
  var cs = root.querySelectorAll('.cc');
  for (var j = 0; j < cs.length; j++) cs[j].classList.toggle('focus', area === 'cont' && j === ci);

<script>

  O.stageXC = Math.round(O.stageX * 0.3); O.stageXP = O.stageX - O.stageXC;
  ds.setProperty('--XC', O.stageXC + 'px'); ds.setProperty('--XP', O.stageXP + 'px');
  var s = Math.min(iw / W, ih / 1080), st = $('stage');
  st.style.transform = s === 1 ? 'none' : 'scale(' + s + ')';
  st.style.left = Math.max(0, Math.round((iw - W * s) / 2)) + 'px';
  st.style.top = Math.max(0, Math.round((ih - 1080 * s) / 2)) + 'px';
}
function hideSplash() {
  var sp = $('splash'); if (!sp) return;
  setTimeout(function () { sp.className = 'out'; setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 700); }, 1300);
}

function boot() {
  scr = { login: O.login, home: O.home, live: O.live, movies: O.movies, series: O.series, detail: O.detail, settings: O.settings, multi: O.multi };
  O.plInit(); fit(); registerKeys();
  document.documentElement.lang = O.lang();
  D.loadInfo(null, null);
  O.app.go(O.needsSetup() ? 'login' : 'home');
  hideSplash();
  setTimeout(function () { if (!O.needsSetup() && O.upd) O.upd.check(false); }, 1500);
}
document.addEventListener('keydown', onKey);
O.app.key = function (code) { onKey({ keyCode: code, which: code, preventDefault: function () {} }); };
document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('[data-back]');
  if (b) { e.stopPropagation(); O.app.key(O.K.BACK); }
}, true);
document.addEventListener('keyup', onKeyUp);
window.addEventListener('resize', fit);
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { Pl.stop(); }
  else if (cur === 'live' || cur === 'multi') { O.app.go(cur); }
});
window.addEventListener('load', boot);
})();

</script>
