<style>
/* Tizen 6.0 = Chromium 76: no `inset`, no flex `gap`, no aspect-ratio, no optional chaining. Keep CSS conservative.
   The whole UI lives in a fixed 1920x1080 stage (scaled by JS if the window differs). */
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Roboto,Arial,"Noto Sans Arabic",sans-serif;color:#fff}
#stage{position:absolute;left:0;top:0;width:var(--W,1920px);height:1080px;transform-origin:0 0;direction:ltr;overflow:hidden}
.hidden{display:none!important}
.screen{position:absolute;left:0;top:0;width:var(--W,1920px);height:1080px;overflow:hidden}
.bg{background:radial-gradient(ellipse 900px 600px at 72% 8%,rgba(40,100,200,.55),rgba(40,100,200,0)),radial-gradient(ellipse 700px 500px at 18% 28%,rgba(60,120,150,.42),rgba(60,120,150,0)),linear-gradient(180deg,#0d2a5a 0%,#08193a 50%,#040b1c 100%)}
.av-object{position:absolute;left:0;top:0;width:var(--W,1920px);height:1080px}
[dir=auto],.nm,.ttl{unicode-bidi:plaintext;text-align:left}
svg{display:block}

/* ---------- brand / header ---------- */
.brand{position:absolute;left:56px;top:30px;height:64px;display:flex;align-items:center}
.bm{width:60px;height:60px;border-radius:18px;background:linear-gradient(145deg,#ff8a3d,#c23bd6 55%,#5b6cff);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;margin-right:16px}
.bt{display:flex;flex-direction:column;line-height:1}
.bt b{font-size:34px;letter-spacing:3px}
.bt i{font-style:normal;font-size:16px;letter-spacing:7px;color:#ff9f43;font-weight:700;margin-top:5px}
.hdr{position:absolute;left:0;top:0;width:var(--W,1920px);height:120px;background:linear-gradient(90deg,rgba(30,80,120,.55),rgba(25,70,170,.7))}
.hbtn{position:absolute;top:30px;width:60px;height:60px;display:flex;align-items:center;justify-content:center}
.hbtn svg{width:52px;height:52px;fill:#fff}

/* ---------- home ---------- */
.clock{position:absolute;right:90px;top:50px;text-align:right}
.clock b{display:block;font-size:64px;font-weight:700;line-height:1}
.clock span{font-size:26px;color:#b8c8e8}
.tiles{position:absolute;left:150px;top:210px;height:520px;width:1640px;display:flex;align-items:center;justify-content:center}
.tile{width:340px;height:340px;margin:0 22px;border-radius:56px;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;overflow:hidden}
.tile svg{width:120px;height:120px;margin-bottom:26px}
.tile h3{margin:0;font-size:36px;letter-spacing:2px;font-weight:700;white-space:nowrap}
.tile p{margin:14px 0 0;font-size:20px;line-height:1.35;color:#d3def5;max-height:56px;overflow:hidden}
.tile.focus{width:470px;height:470px;background:rgba(255,255,255,.22);border-color:#fff}
.tile.focus svg{width:170px;height:170px}
.tile.focus h3{font-size:46px}
.plbadge{position:absolute;left:150px;bottom:140px;padding:20px 38px;border-radius:30px;background:rgba(4,10,24,.85);border:2px solid rgba(255,255,255,.18);font-size:34px;color:#e5ecfa}
.plbadge b{color:#ffe600;margin-left:12px}

/* ---------- key hints ---------- */
.hints{position:absolute;left:40px;bottom:14px;display:flex;font-size:19px;color:#b9c7e3;z-index:3}
.hints span{display:flex;align-items:center;margin-right:30px}
.kd{display:inline-block;width:16px;height:16px;border-radius:50%;margin-right:9px}
.kd.r{background:#ff4b4b}.kd.g{background:#3ddc84}.kd.y{background:#ffd23f}.kd.b{background:#4f8cff}.kd.w{background:#fff}

/* ---------- search box ---------- */
.sbox{position:absolute;height:76px;border-radius:22px;background:rgba(5,12,28,.85);border:2px solid transparent;display:flex;align-items:center;padding:0 22px}
.sbox svg{width:34px;height:34px;fill:#9fb0cf;flex:none;margin-right:20px}
.sbox input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font-size:26px;letter-spacing:1px;font-family:inherit;text-transform:none}
.sbox input::placeholder{color:#8ea0c2}
.sbox.focus{border-color:#fff;background:rgba(20,40,80,.95)}

/* ---------- live screen ---------- */
.live{background:transparent}
.lv-shadow{position:absolute;left:1228px;top:150px;width:664px;height:374px;border-radius:20px;box-shadow:0 0 0 3000px #07132b}
.live .hdr{z-index:1}
.pane{position:absolute;top:120px;height:960px;background:rgba(6,14,34,.55)}
.lv-cats{left:0;width:560px}
.lv-chs{left:560px;width:640px;border-left:1px solid rgba(255,255,255,.1);border-right:1px solid rgba(255,255,255,.1)}
.lv-list{position:absolute;overflow:hidden}
#lvCats{left:0;top:240px;width:560px;height:840px;padding:0 12px}
#lvChs{left:566px;top:240px;width:628px;height:840px;padding:0 6px}
.cat{height:74px;border-radius:16px;display:flex;align-items:center;padding:0 30px;font-size:27px;font-weight:600;letter-spacing:.5px;border:2px solid transparent}
.cat .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat b{flex:none;font-size:24px;margin-left:12px;color:#d6e0f5}
.cat .lk{flex:none;width:24px;height:24px;margin-right:12px;fill:#ffd23f}
.cat.pseudo{font-size:28px;font-weight:700}
.cat.act{background:rgba(20,80,170,.85)}
.cat.sel{background:rgba(255,210,63,.28)}
.cat.focus{border-color:#fff;background:rgba(40,100,200,.9)}
.ch{height:104px;border-radius:18px;background:rgba(255,255,255,.08);display:flex;align-items:center;padding:0 22px 0 16px;border:2px solid transparent}
.ch .no{flex:none;width:44px;font-size:17px;color:#8ea0c2;text-align:center}
.lg{flex:none;width:74px;height:74px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#cfe0ff;margin-right:22px}
.lg img{width:100%;height:100%;object-fit:contain}
.ch .nm{flex:1;min-width:0;font-size:27px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrt svg{width:40px;height:40px;fill:none;stroke:#9fb0cf;stroke-width:1.8}
.hrt.on svg{fill:#ff3d7f;stroke:#ff3d7f}
.ck{flex:none;width:36px;height:36px;border-radius:10px;border:3px solid #9fb0cf}
.ck.on{background:#ffd23f;border-color:#ffd23f}
.ch.now .nm{color:#ff4d94}
.ch.sel{background:rgba(255,210,63,.22)}
.ch.focus{border-color:#fff;background:rgba(80,70,140,.8)}
.lv-info{position:absolute;left:1228px;top:545px;width:664px}
.lv-info h2{margin:0;font-size:44px;font-weight:700;line-height:1.2;max-height:110px;overflow:hidden}
.lv-info hr{border:0;border-top:2px solid rgba(255,255,255,.3);margin:18px 0}
.lv-info p{margin:0;font-size:22px;color:#b8c8e8;line-height:1.5}
.lv-prev{position:absolute;left:1228px;top:150px;width:664px;height:374px;border-radius:20px;border:3px solid transparent;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:24px;text-align:center;padding:20px;pointer-events:none}
.lv-prev.focus{border-color:#fff}
.lv-prev.msg{background:#000}
.lv-msg{position:absolute;left:30px;top:250px;font-size:26px;color:#9fb0cf;line-height:1.7;width:520px}
.live.overlay .lv-shadow,.live.overlay .lv-info,.live.overlay .lv-prev,.live.overlay .hdr,.live.overlay .brand,.live.overlay .hbtn{display:none}
.live.overlay .pane{top:0;height:1080px;background:rgba(4,10,26,.9)}
.live.overlay .lv-hint{display:none}
.editbar{position:absolute;left:0;bottom:0;width:var(--W,1920px);height:84px;background:rgba(255,160,40,.95);color:#201400;font-size:24px;font-weight:700;display:flex;align-items:center;padding:0 40px;z-index:5}
.editbar span{margin-right:36px;display:flex;align-items:center}
.editbar .kd{border:2px solid #201400}

/* ---------- vod grid ---------- */
.vd-search{left:1010px;top:22px;width:640px}
.vd-cats{left:0;top:240px;width:560px;height:840px;padding:0 12px}
.vd-grid{left:580px;top:150px;width:1316px;height:920px}
.vrow{display:grid}
.pc{position:relative;border-radius:18px;border:3px solid transparent;padding:0}
.pc .pi{position:relative;height:340px;border-radius:16px;overflow:hidden;background:#13234a}
.pc .pi img{width:100%;height:100%;object-fit:cover}
.pc .pn{height:70px;padding:10px 6px 0;font-size:22px;line-height:1.25;color:#e8efff;overflow:hidden}
.pc .rt{position:absolute;left:10px;top:10px;min-width:62px;height:46px;border-radius:12px;background:rgba(40,90,180,.85);font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 10px}
.pc .hrt{position:absolute;right:10px;top:10px;width:62px;height:62px;border-radius:14px;background:rgba(40,90,180,.85);display:flex;align-items:center;justify-content:center}
.pc .hrt svg{width:40px;height:40px;stroke:#fff}
.pc .hrt.on svg{stroke:#ff3d7f}
.pc.focus{border-color:#fff;background:rgba(255,255,255,.12)}
.pc .pi img{position:relative}
.pc .ph{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:700;color:#4d66a8}
.pc .pb{position:absolute;left:0;bottom:70px;height:6px;background:#ff4d94}

/* ---------- detail ---------- */
.dt-poster{position:absolute;left:60px;top:150px;width:380px;height:570px;border-radius:20px;overflow:hidden;background:#13234a}
.dt-poster img{width:100%;height:100%;object-fit:cover}
.dt-title{position:absolute;left:500px;top:140px;width:1360px;font-size:52px;font-weight:700;line-height:1.15;max-height:122px;overflow:hidden}
.dt-meta{position:absolute;left:500px;top:272px;width:1360px;font-size:24px;color:#ffd23f}
.dt-plot{position:absolute;left:500px;top:318px;width:1360px;height:118px;font-size:23px;line-height:1.5;color:#c9d6f0;overflow:hidden}
.dt-seasons{position:absolute;left:500px;top:446px;width:1360px;height:64px;overflow:hidden;white-space:nowrap}

.dt-btns{position:absolute;left:60px;top:740px;width:380px}

/* ---------- settings ---------- */

/* ---------- player overlays ---------- */
#player{background:transparent;pointer-events:none}
.pinfo{position:absolute;left:0;bottom:0;width:var(--W,1920px);height:230px;padding:0 90px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.85));opacity:0}

.pinfo .sub{position:absolute;left:90px;bottom:52px;font-size:26px;color:#c3d1ee}
.pinfo .rt1{position:absolute;right:90px;bottom:52px;font-size:26px;color:#c3d1ee}

.pvod{position:absolute;left:0;bottom:0;width:var(--W,1920px);height:300px;padding:0 90px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.9));opacity:0}

.pvod .sub{position:absolute;left:90px;top:132px;font-size:25px;color:#c3d1ee}
.pvod .ico{position:absolute;right:90px;top:70px;font-size:50px}
.pv-track{position:absolute;left:90px;right:90px;top:190px;height:10px;border-radius:5px;background:rgba(255,255,255,.28)}
.pv-fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:#ff4d94;width:0}
.pv-knob{position:absolute;top:-8px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:#fff;left:0}
.pv-t{position:absolute;top:218px;font-size:25px;color:#e2eaff}
.pspin{position:absolute;left:760px;top:420px;width:400px;text-align:center;font-size:24px;text-shadow:0 1px 4px #000}
.spinner{width:64px;height:64px;margin:0 auto 18px;border:6px solid rgba(255,255,255,.25);border-top-color:#ff3d7f;border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.perr{position:absolute;left:460px;top:380px;width:1000px;padding:30px 40px;background:#17233b;border:1px solid rgba(255,255,255,.2);border-radius:18px;font-size:27px;line-height:1.7;text-align:center}
.perr small{display:block;margin-top:12px;color:#8fa0bd;font-size:16px;direction:ltr;word-break:break-all}
.lv-prev .spinner{width:50px;height:50px;border-width:5px}
#numBadge{position:absolute;right:80px;top:40px;z-index:60;background:#10203f;border:3px solid #8fb2ff;border-radius:18px;padding:10px 32px;font-size:56px;font-weight:700}
#toast{position:absolute;left:50%;bottom:110px;margin-left:-330px;width:660px;text-align:center;z-index:70;background:#1b2b48;border:1px solid rgba(255,255,255,.25);padding:18px 28px;border-radius:16px;font-size:24px;line-height:1.4}

/* ---------- multi screen ---------- */
.mu-cell{position:absolute;border:4px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:34px;text-align:center;padding:14px;background:rgba(4,10,26,.55)}
.mu-cell.focus{border-color:#ffd23f}
.mu-cell small{display:block;font-size:20px;color:#c3d1ee;margin-top:8px}

.brand,.hbtn{z-index:2}

/* ================= wide screens (long phones): stage width = var(--W) ================= */
.tiles,.plbadge{margin-left:var(--X2,0px)}
.st-grid,.st-title{margin-left:var(--X2,0px)}
.mbox,.pspin,.perr{margin-left:var(--X2,0px)}
.lv-shadow,.lv-info,.lv-prev{margin-left:var(--X,0px)}
.lv-chs{width:calc(640px + var(--X,0px))}
#lvChs{width:calc(628px + var(--X,0px))}
.vd-search{margin-left:var(--X,0px)}
.vd-grid{width:calc(1316px + var(--X,0px))}
.dt-title,.dt-meta,.dt-plot,.dt-seasons,#dtEps{width:calc(1360px + var(--X,0px))}

/* ================= Ossi TV premium theme (neon cyan / magenta on midnight) ================= */
/* html/body must stay transparent: the video is drawn BEHIND the page */
.bg{background:
  radial-gradient(ellipse 1100px 700px at 85% -10%,rgba(217,70,239,.30),rgba(217,70,239,0)),
  radial-gradient(ellipse 1000px 650px at 5% 105%,rgba(34,211,238,.22),rgba(34,211,238,0)),
  radial-gradient(ellipse 900px 500px at 50% 40%,rgba(60,50,160,.22),rgba(60,50,160,0)),
  linear-gradient(180deg,#0a0b2e 0%,#060720 55%,#03041a 100%)}
.brand{top:10px;left:44px;height:100px}
.brand img{height:100px;width:auto;display:block;filter:drop-shadow(0 0 18px rgba(80,120,255,.35))}
.hdr{background:linear-gradient(90deg,rgba(10,12,44,.92),rgba(30,14,64,.9));box-shadow:0 1px 0 rgba(255,255,255,.06),0 2px 0 -1px rgba(34,211,238,.25)}
.hdr:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,rgba(34,211,238,0),rgba(34,211,238,.7),rgba(217,70,239,.7),rgba(217,70,239,0))}
.clock b{font-weight:300;letter-spacing:2px;font-size:72px;text-shadow:0 0 24px rgba(34,211,238,.35)}
.clock span{color:#a9b4e0;letter-spacing:1px}

/* home tiles: glass + neon */
.tile{background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:2px solid rgba(255,255,255,.12);border-radius:48px;box-shadow:0 20px 50px rgba(0,0,0,.45);transition:width .18s,height .18s,box-shadow .18s}
.tile.focus{background:linear-gradient(160deg,rgba(34,211,238,.20),rgba(140,60,240,.16) 55%,rgba(217,70,239,.24));border-color:rgba(255,255,255,.85);
  box-shadow:0 0 0 1px rgba(255,255,255,.25),0 0 46px rgba(34,211,238,.45),0 0 90px rgba(217,70,239,.35),0 30px 60px rgba(0,0,0,.5)}
.tile h3{letter-spacing:1px}
.tile p{color:#b9c3ea}
.plbadge{background:rgba(10,12,40,.7);border:1px solid rgba(255,255,255,.14);border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-size:30px}
.plbadge b{color:#5eead4}
.hints{color:#8d97c4}

/* lists & focus */
.lv-shadow{box-shadow:0 0 0 3000px #05061f}
.pane{background:rgba(8,10,36,.6)}
.cat.act{background:linear-gradient(90deg,rgba(34,211,238,.22),rgba(34,211,238,.04));box-shadow:inset 4px 0 0 #22d3ee}
.ch{background:rgba(255,255,255,.05)}
.cat.focus,.ch.focus,.ep.focus,.mr.focus{border-color:rgba(255,255,255,.9);
  background:linear-gradient(90deg,rgba(34,211,238,.38),rgba(168,85,247,.32) 60%,rgba(217,70,239,.38));
  box-shadow:0 0 26px rgba(34,211,238,.35),0 0 40px rgba(217,70,239,.22)}
.ch.now .nm{color:#f0abfc}
.lg{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}
.sbox{background:rgba(6,8,30,.85);border:2px solid rgba(255,255,255,.08);border-radius:38px}
.sbox.focus{border-color:#22d3ee;background:rgba(14,18,60,.95);box-shadow:0 0 24px rgba(34,211,238,.35)}
.lv-prev.focus{border-color:#22d3ee;box-shadow:0 0 30px rgba(34,211,238,.5)}
.lv-info h2{text-shadow:0 2px 12px rgba(0,0,0,.6)}

/* posters */
.pc .pi{background:linear-gradient(160deg,#141a4a,#0b0c2c);box-shadow:0 12px 30px rgba(0,0,0,.45)}
.pc.focus{border-color:rgba(255,255,255,.9);background:transparent;box-shadow:0 0 34px rgba(34,211,238,.45),0 0 60px rgba(217,70,239,.3)}
.pc .rt,.pc .hrt{background:rgba(10,12,40,.78);border:1px solid rgba(255,255,255,.18)}
.pc .pb,.ep .pb,.pv-fill{background:linear-gradient(90deg,#22d3ee,#d946ef)}
.sn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16)}
.sn.act{background:linear-gradient(90deg,#0891b2,#a21caf)}
.sn.focus{border-color:#fff;box-shadow:0 0 24px rgba(34,211,238,.45)}

/* settings tiles */
.stile{background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.025));border:2px solid rgba(255,255,255,.1);box-shadow:0 14px 36px rgba(0,0,0,.4)}
.stile.focus{border-color:rgba(255,255,255,.85);background:linear-gradient(160deg,rgba(34,211,238,.2),rgba(217,70,239,.22));box-shadow:0 0 40px rgba(34,211,238,.4),0 0 70px rgba(217,70,239,.28)}

/* dialogs & player */
#modal{background:rgba(2,3,16,.7)}
.mbox{background:linear-gradient(170deg,#11134a,#0a0b2c);border:1px solid rgba(255,255,255,.16);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(120,60,240,.25)}
.mr{background:rgba(255,255,255,.05)}
.spinner{border-color:rgba(255,255,255,.18);border-top-color:#22d3ee;border-right-color:#d946ef}
.pinfo .big{color:#67e8f9}
.live-pill{background:linear-gradient(90deg,#e11d48,#d946ef)}
#toast{background:rgba(14,16,52,.95);border:1px solid rgba(34,211,238,.35);box-shadow:0 10px 40px rgba(0,0,0,.5)}
#numBadge{background:#0d0f3a;border-color:#22d3ee}
.perr{background:#0f1240}

/* splash */
#splash{position:fixed;left:0;top:0;right:0;bottom:0;z-index:100000;background:radial-gradient(ellipse at 50% 45%,#12124a 0%,#05061f 60%,#02030f 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .6s}
#splash img{width:62vmin;max-width:900px;height:auto;animation:spIn 1s ease-out both}
#splash i{display:block;width:30vmin;height:3px;margin-top:4vmin;border-radius:2px;background:linear-gradient(90deg,rgba(34,211,238,0),#22d3ee,#d946ef,rgba(217,70,239,0));background-size:200% 100%;animation:spBar 1.2s linear infinite}
#splash.out{opacity:0;pointer-events:none}
@keyframes spIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes spBar{from{background-position:200% 0}to{background-position:0 0}}
#home .brand{top:14px}
#home .brand img{height:150px}

/* ================= v1.2: resolution, player controls, touch ================= */
.vin{will-change:transform}
.res{display:inline-block;margin-right:16px;padding:5px 14px;border-radius:8px;font-size:19px;font-weight:700;letter-spacing:.5px;color:#fff;
  background:linear-gradient(90deg,rgba(34,211,238,.35),rgba(217,70,239,.35));border:1px solid rgba(255,255,255,.25);vertical-align:middle;direction:ltr}
.lv-info .lvres{margin:10px 0 6px}
.pv-keys{position:absolute;right:90px;top:136px;display:flex;font-size:21px;color:#c3d1ee}
.pv-keys span{display:flex;align-items:center;margin-left:28px}
#pTouch{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1;display:none;pointer-events:auto}
#pInfo,#pVod{z-index:2}
#pCtl{position:absolute;left:0;top:0;width:100%;height:100%;z-index:3;pointer-events:none;display:none;opacity:0;transition:opacity .2s}
#pCtl.show{opacity:1}
#pCtl .pcb{pointer-events:none}
#pCtl.show .pcb{pointer-events:auto}
.pcb{position:relative;display:flex;align-items:center;justify-content:center;width:120px;height:120px;border-radius:50%;
  background:rgba(8,10,34,.55);border:2px solid rgba(255,255,255,.22);box-shadow:0 8px 30px rgba(0,0,0,.45)}
.pcb svg{width:58%;height:58%}
.pcb.big{width:150px;height:150px}
.pcb.huge{width:190px;height:190px;background:linear-gradient(160deg,rgba(34,211,238,.35),rgba(217,70,239,.35));border-color:rgba(255,255,255,.5)}
.pcb:active{transform:scale(.94)}
.pc-back{position:absolute;left:50px;top:40px}
.pc-tr{position:absolute;right:50px;top:40px;display:flex}
.pc-tr .pcb{width:auto;height:96px;border-radius:48px;padding:0 34px 0 26px;margin-left:22px}
.pc-tr .pcb svg{width:52px;height:52px;margin-right:12px}
.pc-tr .pcb i{font-style:normal;font-size:28px;font-weight:600}
.pc-mid{position:absolute;left:0;right:0;top:50%;margin-top:-95px;height:190px;display:flex;align-items:center;justify-content:center}
.pc-mid .pcb{margin:0 70px}
#player.k-live .vodonly,#player.k-vod .liveonly{display:none!important}
.pc-flash{position:absolute;top:50%;margin-top:-80px;width:220px;height:160px;line-height:160px;text-align:center;font-size:56px;font-weight:800;
  border-radius:80px;background:rgba(255,255,255,.14);opacity:0;transition:opacity .25s}
.pc-flash.on{opacity:1}
.pc-flash.l{left:12%}.pc-flash.r{right:12%}
.pv-hit{position:absolute;left:60px;right:60px;top:160px;height:70px}

/* drag & drop re-ordering */
.vdrop{position:absolute;height:6px;border-radius:3px;z-index:6;background:linear-gradient(90deg,#22d3ee,#d946ef);box-shadow:0 0 18px rgba(34,211,238,.8);pointer-events:none}
.vghost{z-index:7;opacity:.92;pointer-events:none;transform:scale(1.03);box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 30px rgba(217,70,239,.5);border-color:#fff!important;
  background:linear-gradient(90deg,rgba(34,211,238,.55),rgba(217,70,239,.55))!important}
.dragging .sel{opacity:.45}
.tbar{display:flex;align-items:center;height:110px;padding:0 30px 0 40px;font-size:25px}
.tbar .et{flex:1;min-width:0;line-height:1.35}
.ebtn{flex:none;margin-left:20px;padding:0 34px;height:72px;line-height:72px;border-radius:36px;background:rgba(32,20,0,.18);border:2px solid #201400;font-size:26px}
.ebtn.on{background:#201400;color:#ffb54a}

/* PIN keypad (touch) */
.pinpad{display:flex;flex-wrap:wrap;width:480px;margin:0 auto 10px}
.pinpad b,.pinpad span{width:140px;height:96px;margin:8px 10px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:40px}
.pinpad b{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
.pinpad b:active{background:rgba(34,211,238,.35)}

/* ---------- touch devices ---------- */
html.touch,html.touch body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html.touch input{-webkit-user-select:text;user-select:text}
html.touch #pTouch,html.touch #pCtl{display:block}
html.touch .hints,html.touch .pv-keys{display:none!important}
html.touch .pv-hit{pointer-events:auto}
html.touch .lv-prev{pointer-events:auto}
html.touch .mrows{overflow-y:auto;-webkit-overflow-scrolling:touch;max-height:640px}
html.touch .dt-seasons{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
html.touch .dt-seasons::-webkit-scrollbar{display:none}
html.touch .tile:active,html.touch .stile:active,html.touch .ch:active,html.touch .cat:active,html.touch .pc:active,html.touch .ep:active{filter:brightness(1.25)}

/* v1.3: native scrolling lists */
.vg{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.vg::-webkit-scrollbar{display:none;width:0;height:0}
.vsp{position:relative;width:100%}

/* ================= v1.4 ================= */
/* home: tiles + continue watching */
#home .tiles{top:150px;height:430px}
#home .tile{width:290px;height:290px;margin:0 20px}
#home .tile svg{width:100px;height:100px;margin-bottom:20px}
#home .tile h3{font-size:32px}
#home .tile p{font-size:18px}
#home .tile.focus{width:380px;height:380px}
#home .tile.focus svg{width:136px;height:136px}
#home .tile.focus h3{font-size:40px}
#home.nocont .tiles{top:240px;height:520px}
#home.nocont .cw-h,#home.nocont .cw{display:none}
#home .plbadge{left:auto;right:calc(420px);top:48px;bottom:auto;padding:12px 26px;font-size:24px;border-radius:20px}
.cw-h{position:absolute;left:110px;top:610px;font-size:30px;font-weight:700;letter-spacing:.5px;color:#e6ebff}
.cw-h:after{content:"";display:inline-block;width:60px;height:3px;margin-left:18px;vertical-align:middle;border-radius:2px;background:linear-gradient(90deg,#22d3ee,#d946ef)}
.cw{position:absolute;left:96px;right:96px;top:660px;height:380px;white-space:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:14px 14px 0}
.cw::-webkit-scrollbar{display:none}
.cc{display:inline-block;vertical-align:top;width:200px;margin-right:26px;white-space:normal;border-radius:18px;padding:6px;border:3px solid transparent;transition:transform .15s}
.cc .ci{position:relative;height:260px;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,#141a4a,#0b0c2c);box-shadow:0 12px 30px rgba(0,0,0,.45)}
.cc .ci img{position:relative;width:100%;height:100%;object-fit:cover}
.cc .ph{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700;color:#4d66a8}
.cc .ck{position:absolute;left:8px;top:8px;font-size:22px;background:rgba(6,8,30,.7);border-radius:10px;padding:2px 8px}
.cc .pb{position:absolute;left:0;bottom:0;height:7px;background:linear-gradient(90deg,#22d3ee,#d946ef)}
.cc .cn{margin-top:10px;font-size:21px;font-weight:600;line-height:1.25;max-height:52px;overflow:hidden;color:#eef2ff}
.cc .cs{margin-top:4px;font-size:18px;color:#9aa6d6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc.focus{border-color:rgba(255,255,255,.9);transform:scale(1.06);box-shadow:0 0 34px rgba(34,211,238,.45),0 0 60px rgba(217,70,239,.3)}

/* settings: 11 tiles in 3 rows */
.st-grid{top:215px}
.stile{height:244px;margin-bottom:24px}
.stile svg{width:78px;height:78px;margin-bottom:20px}
.stile span{font-size:23px}

/* live rows: current programme + archive mark */
.ch .chx{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.ch .chx .nm{flex:none}
.ch .np{font-size:19px;color:#9fb0e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px;line-height:1.2}
.ch .np:empty{display:none}
.ch .arc{flex:none;width:30px;height:30px;margin:0 10px}
.ch .arc svg{width:30px;height:30px}
.lvepg{margin-top:14px}
.lvepg .e-now{display:flex;align-items:baseline;font-size:24px}
.lvepg .e-d{font-size:19px;color:#a9b4dc;line-height:1.45;max-height:83px;overflow:hidden;margin-top:8px}
.lvbtn{display:inline-flex;align-items:center;margin-top:18px;padding:0 30px 0 20px;height:66px;border-radius:33px;font-size:24px;font-weight:600;
  background:linear-gradient(90deg,rgba(34,211,238,.25),rgba(217,70,239,.25));border:1px solid rgba(255,255,255,.3)}
.lvbtn svg{width:34px;height:34px;margin-right:12px}
.lvbtn .kd{margin:0 0 0 12px}
.lv-info p.lvhint{margin-top:16px;font-size:19px;color:#8d97c4}
/* EPG blocks (shared) */
.e-now{display:flex;align-items:baseline;min-width:0}
.e-t{flex:none;color:#67e8f9;font-weight:700;margin-right:14px;direction:ltr}
.e-n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.e-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.18);margin:10px 0 8px;overflow:hidden}
.e-bar i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#d946ef)}
.e-next{display:flex;align-items:baseline;font-size:20px;color:#b3bde3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-next .e-t{color:#a5b4fc}
.pinfo{height:300px}
.pepg{position:absolute;right:90px;bottom:100px;width:820px;font-size:26px}
.pepg .e-next{font-size:22px}

/* player: top-left buttons, gestures, next episode, PiP */
.pc-tl{position:absolute;left:50px;top:40px;display:flex}
.pc-tl .pcb{width:110px;height:110px;margin-right:22px}
.pc-gest{position:absolute;top:50%;margin-top:-170px;width:120px;height:340px;border-radius:60px;background:rgba(6,8,30,.7);border:1px solid rgba(255,255,255,.2);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:26px 0;opacity:0;transition:opacity .2s;pointer-events:none}
.pc-gest.on{opacity:1}
.pc-gest.vol{right:120px}.pc-gest.bri{left:120px}
.pc-gest .pg-ic svg{width:54px;height:54px}
.pc-gest .pg-bar{position:relative;width:14px;height:170px;border-radius:7px;background:rgba(255,255,255,.2);overflow:hidden}
.pc-gest .pg-bar b{position:absolute;left:0;bottom:0;width:100%;background:linear-gradient(0deg,#22d3ee,#d946ef)}
.pc-gest span{font-size:24px;font-weight:700}
#pNext{position:absolute;right:80px;bottom:120px;width:720px;padding:34px 40px;border-radius:30px;z-index:4;display:none;pointer-events:auto;
  background:linear-gradient(160deg,rgba(17,19,74,.96),rgba(10,11,44,.96));border:1px solid rgba(255,255,255,.2);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(120,60,240,.3)}
#pNext.show{display:block}
.nu-l{font-size:22px;color:#67e8f9;font-weight:700;letter-spacing:1px}
.nu-t{font-size:38px;font-weight:700;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nu-s{font-size:24px;color:#b9c3ea;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nu-b{display:flex;margin-top:26px}
.nu-b b{display:flex;align-items:center;height:76px;padding:0 34px;margin-right:20px;border-radius:38px;font-size:26px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.22)}
.nu-b b.on{background:linear-gradient(90deg,#0891b2,#a21caf);border-color:rgba(255,255,255,.7)}
.nu-b i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.35);margin-right:14px;font-weight:800}
html.pip #pCtl,html.pip #pInfo,html.pip #pVod,html.pip #pNext,html.pip #toast,html.pip #modal,html.pip #numBadge,html.pip #pSpin,html.pip #pErr,html.pip #splash{display:none!important}

/* detail page (movies + series) */
.dt-bd{position:absolute;left:0;top:0;width:100%;height:100%;background-size:cover;background-position:center 20%;opacity:.32;filter:blur(6px);transform:scale(1.04)}
#detail:before{content:"";position:absolute;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(5,6,26,.95) 0%,rgba(5,6,26,.75) 45%,rgba(5,6,26,.55) 100%)}
#detail>*{z-index:1}
#detail .dt-bd{z-index:0}
.dt-poster{box-shadow:0 20px 50px rgba(0,0,0,.6)}
.dt-btns{top:740px}
.dbtn{display:flex;align-items:center;height:70px;margin-bottom:12px;padding:0 22px;border-radius:20px;font-size:24px;font-weight:600;
  background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14)}
.dbtn svg{flex:none;width:34px;height:34px;margin-right:16px}
.dbtn span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbtn.main{background:linear-gradient(90deg,rgba(8,145,178,.85),rgba(162,28,175,.85));border-color:rgba(255,255,255,.4)}
.dbtn.focus{border-color:#fff;box-shadow:0 0 30px rgba(34,211,238,.45),0 0 50px rgba(217,70,239,.3)}
.dt-crew{position:absolute;left:500px;top:310px;width:calc(1360px + var(--X,0px));font-size:21px;color:#c9d2f2;line-height:1.5}
.dt-crew div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt-crew b{color:#67e8f9;margin-right:8px}
.dt-plot{top:384px;height:62px}
#detail.dt-movie .dt-plot{height:520px;font-size:26px;line-height:1.6}
#detail.dt-movie .dt-seasons,#detail.dt-movie #dtEps{display:none}

/* v1.5: back button in section headers (touch) + on-screen volume / brightness bars */
.hback{display:none}
html.touch .brand.sub{display:none}
html.touch .hback{position:absolute;left:36px;top:16px;height:88px;display:flex;align-items:center;z-index:3;padding:0 34px 0 0;border-radius:44px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}
.hback .hb-ic{width:88px;height:88px;border-radius:44px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,rgba(34,211,238,.35),rgba(217,70,239,.35));border:1px solid rgba(255,255,255,.35)}
.hback .hb-ic svg{width:46px;height:46px}
.hback .hb-t{margin-left:20px;font-size:32px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.hback:not(:has(.hb-t)){padding:0}
html.touch .hback:active{filter:brightness(1.3)}
.live.overlay .hback{display:none!important}
.pc-sl{position:absolute;top:240px;width:116px;height:500px;border-radius:58px;display:none;flex-direction:column;align-items:center;padding:20px 0;
  background:rgba(6,8,30,.62);border:1px solid rgba(255,255,255,.2);box-shadow:0 10px 30px rgba(0,0,0,.45)}
html.touch .pc-sl{display:flex}
.pc-sl.vol{right:60px}.pc-sl.bri{left:60px}
.pc-sl .sl-ic svg{width:46px;height:46px}
.pc-sl .sl-b{width:76px;height:64px;margin:8px 0;border-radius:32px;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:300;line-height:1;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);pointer-events:auto}
.pc-sl .sl-b:active{background:rgba(34,211,238,.4)}
.pc-sl .sl-tr{position:relative;flex:1;width:56px;display:flex;justify-content:center;pointer-events:auto}
.pc-sl .sl-tr:before{content:"";position:absolute;top:0;bottom:0;width:14px;border-radius:7px;background:rgba(255,255,255,.2)}
.pc-sl .sl-tr i{position:absolute;bottom:0;width:14px;border-radius:7px;background:linear-gradient(0deg,#22d3ee,#d946ef)}
.pc-sl .sl-v{font-size:22px;font-weight:700;margin-top:6px}
#pCtl:not(.show) .pc-sl *{pointer-events:none!important}

/* v1.5.1: live screen split on wide screens (channel list a bit wider, preview much bigger) */
.lv-chs{width:calc(640px + var(--XC,0px))}
#lvChs{width:calc(628px + var(--XC,0px))}
.lv-shadow,.lv-prev{margin-left:var(--XC,0px);width:calc(664px + var(--XP,0px));height:calc((664px + var(--XP,0px)) * 0.5625)}
.lv-info{margin-left:var(--XC,0px);width:calc(664px + var(--XP,0px));top:calc(150px + (664px + var(--XP,0px)) * 0.5625 + 22px)}
html.touch .lv-info p.lvhint{display:none}
html.touch .lv-info h2{font-size:40px;max-height:96px}
html.touch .lv-info hr{margin:12px 0}
html.touch .lvepg .e-d{max-height:56px}

/* home: subscription days left next to the playlist badge */
#home .hinfo{position:absolute;right:400px;top:40px;display:flex;align-items:center;z-index:2}
#home .hinfo .plbadge{position:relative;left:auto;right:auto;top:auto;bottom:auto}
.subbadge{display:flex;align-items:center;margin-right:18px;padding:8px 26px 8px 10px;border-radius:22px;background:rgba(10,12,40,.7);
  border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.subbadge .sd{min-width:64px;height:64px;padding:0 10px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;margin-right:16px;direction:ltr}
.subbadge .sl{display:flex;flex-direction:column;font-size:22px;font-weight:700;line-height:1.25}
.subbadge .sl small{font-size:18px;font-weight:400;color:#aab4dc}
.subbadge.ok .sd{background:linear-gradient(160deg,#0d9488,#22c55e)}
.subbadge.warn .sd{background:linear-gradient(160deg,#d97706,#f59e0b)}
.subbadge.bad .sd{background:linear-gradient(160deg,#be123c,#ef4444)}
.subbadge.bad{border-color:rgba(239,68,68,.6)}

/* v1.6: remote re-ordering (Fire TV ☰) */
.pc.sel .pi{outline:6px solid #ffb54a;outline-offset:-6px}
.pc.sel:after{content:"✓";position:absolute;right:14px;bottom:62px;width:46px;height:46px;border-radius:50%;background:#ffb54a;color:#201400;
  font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center}
.pc{position:relative}
.moving .ch.sel,.moving .cat.sel{background:linear-gradient(90deg,rgba(255,181,74,.55),rgba(255,120,40,.4));box-shadow:0 0 26px rgba(255,170,60,.55);transform:scale(1.015)}
.moving .pc.sel{transform:scale(1.05);box-shadow:0 0 40px rgba(255,170,60,.6)}
.editbar span{white-space:nowrap}

/* ================= login ================= */
#login{display:flex}
#login.hidden{display:none}
.lg-wrap{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.lg-logo{flex:none;width:720px;margin-right:110px;display:flex;justify-content:center}
.lg-logo img{width:100%;height:auto;filter:drop-shadow(0 0 40px rgba(120,80,255,.45));animation:spIn .9s ease-out both}
.lg-card{flex:none;width:760px;padding:56px 60px 60px;border-radius:44px;background:linear-gradient(165deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.16);box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 80px rgba(120,60,240,.18)}
.lg-card h1{font-size:54px;font-weight:800;margin:0 0 10px;letter-spacing:.5px}
.lg-sub{font-size:24px;color:#aab4dc;margin:0 0 40px;line-height:1.4}
.lg-f{display:flex;align-items:center;height:104px;margin-bottom:24px;padding:0 26px;border-radius:30px;background:rgba(4,6,26,.75);border:3px solid rgba(255,255,255,.1)}
.lg-f.focus,.lg-f:focus-within{border-color:#22d3ee;box-shadow:0 0 30px rgba(34,211,238,.35)}
.lg-ic svg{width:46px;height:46px;margin-right:22px;display:block}
.lg-f input{flex:1;min-width:0;height:100%;background:transparent;border:0;outline:0;color:#fff;font-size:36px;font-family:inherit;direction:ltr;text-align:left}
.lg-f input::placeholder{color:#6f7aa8}
.lg-eye{flex:none;width:76px;height:76px;display:flex;align-items:center;justify-content:center;border-radius:38px}
.lg-eye svg{width:44px;height:44px}
.lg-eye:active{background:rgba(255,255,255,.12)}
.lg-err{min-height:40px;font-size:25px;color:#fb7185;margin:4px 6px 14px;opacity:0;transition:opacity .2s}
.lg-err.on{opacity:1}
.lg-btn{height:108px;border-radius:54px;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;letter-spacing:1px;
  background:linear-gradient(90deg,#0891b2,#7c3aed 55%,#c026d3);border:3px solid rgba(255,255,255,.35);box-shadow:0 18px 40px rgba(124,58,237,.4)}
.lg-btn.focus{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.2),0 0 50px rgba(34,211,238,.5),0 0 80px rgba(217,70,239,.4)}
.lg-btn.busy{opacity:.7}
html.touch .lg-btn:active{filter:brightness(1.2)}

/* ================= TV (remote) light mode: no blur glows, no layout animations — smooth on Fire TV sticks ================= */
html:not(.touch) *{transition:none!important;animation-duration:0s!important}
html:not(.touch) #splash{transition:opacity .5s!important}
html:not(.touch) .bg{background:linear-gradient(160deg,#0b0d33 0%,#070823 50%,#03041a 100%)}
html:not(.touch) .brand img,html:not(.touch) .lg-logo img{filter:none}
html:not(.touch) .clock b{text-shadow:none}
html:not(.touch) .dt-bd{filter:none;opacity:.22;transform:none}
/* home tiles: same box, focus = scale on the compositor instead of resizing */
html:not(.touch) #home .tile,html:not(.touch) #home .tile.focus{width:290px;height:290px;margin:0 52px;box-shadow:none;will-change:transform}
html:not(.touch) #home .tile svg,html:not(.touch) #home .tile.focus svg{width:100px;height:100px}
html:not(.touch) #home .tile h3,html:not(.touch) #home .tile.focus h3{font-size:32px}
html:not(.touch) #home .tile.focus{transform:scale(1.28);transition:transform .12s ease-out!important;border-color:#fff;box-shadow:0 0 0 3px rgba(34,211,238,.6)}
html:not(.touch) #home .tile:not(.focus){transform:scale(1);transition:transform .12s ease-out!important}
/* cheap focus rings everywhere (solid, no blur) */
html:not(.touch) .tile,html:not(.touch) .stile,html:not(.touch) .pc .pi,html:not(.touch) .cc .ci,html:not(.touch) .pcb,html:not(.touch) .plbadge,html:not(.touch) .subbadge,html:not(.touch) .dt-poster,html:not(.touch) .lg-card,html:not(.touch) .lg-btn{box-shadow:none}
html:not(.touch) .ch.focus,html:not(.touch) .cat.focus,html:not(.touch) .ep.focus,html:not(.touch) .mr.focus,html:not(.touch) .stile.focus,html:not(.touch) .dbtn.focus,
html:not(.touch) .sbox.focus,html:not(.touch) .lv-prev.focus,html:not(.touch) .lg-f.focus,html:not(.touch) .lg-btn.focus,html:not(.touch) .sn.focus{box-shadow:0 0 0 3px rgba(255,255,255,.9)}
html:not(.touch) .pc.focus,html:not(.touch) .cc.focus{box-shadow:none;transform:none;border-color:#fff}
html:not(.touch) .pc.focus .pi,html:not(.touch) .cc.focus .ci{box-shadow:0 0 0 4px #22d3ee}
html:not(.touch) .ch.focus,html:not(.touch) .cat.focus,html:not(.touch) .ep.focus,html:not(.touch) .mr.focus{background:linear-gradient(90deg,#0e6f86,#5b2a8e)}
html:not(.touch) .mbox{box-shadow:0 20px 50px rgba(0,0,0,.6)}
html:not(.touch) .moving .ch.sel,html:not(.touch) .moving .cat.sel,html:not(.touch) .moving .pc.sel{box-shadow:0 0 0 3px #ffb54a;transform:none}

/* browser build */
html{background:#03041a}
#bvid{position:fixed;left:0;top:0;width:100%;height:100%;z-index:0;background:#000;object-fit:contain;visibility:hidden}
#stage{z-index:1}
#av-player{visibility:hidden!important}
#bvid::cue{font-size:1.15em;background:transparent;text-shadow:0 0 4px #000,0 0 4px #000}

</style>

/* ---------- storage ---------- */
var mem = {};
function rg(k) { try { return localStorage.getItem(k); } catch (e) { return mem.hasOwnProperty(k) ? mem[k] : null; } }
function rs(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } }
function rd(k) { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } }
function parse(v, d) { if (v == null) return d; try { return JSON.parse(v); } catch (e) { return d; } }
O.store = {
  g: function (k, d) { return parse(rg('ossi.g.' + k), d); },
  gs: function (k, v) { rs('ossi.g.' + k, JSON.stringify(v)); },
  p: function (k, d) { return parse(rg('ossi.p.' + O.pl.id + '.' + k), d); },
  ps: function (k, v) { rs('ossi.p.' + O.pl.id + '.' + k, JSON.stringify(v)); },
  pd: function (k) { rd('ossi.p.' + O.pl.id + '.' + k); },
  pdPrefix: function (prefix) {
    var full = 'ossi.p.' + O.pl.id + '.' + prefix, keys = [];
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k.indexOf(full) === 0) keys.push(k); } } catch (e) {}
    keys.forEach(rd);
  },
  pdAll: function (id) {
    var full = 'ossi.p.' + id + '.', keys = [];
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k.indexOf(full) === 0) keys.push(k); } } catch (e) {}
    keys.forEach(rd);
  }
};
O.cfg = {
  get: function (k, d) { return O.store.g('cfg.' + k, d); },
  set: function (k, v) { O.store.gs('cfg.' + k, v); }
};

/* ---------- playlists ---------- */
function normHost(h) {
  h = String(h || '').replace(/^\s+|\s+$/g, '');
  if (!/^https?:\/\//i.test(h)) h = 'http://' + h;
  return h.replace(/\/+$/, '');
}
O.normHost = normHost;
O.plList = function () {
  var l = O.store.g('playlists', null);
  if (!l || !l.length) {
    var C = window.OSSI_CONFIG || {};
    l = [{ id: 'p1', name: C.name || 'Ossi', host: normHost(C.host), user: C.username || '', pass: C.password || '' }];
    O.store.gs('playlists', l);
  }
  var fh = O.fixedHost && O.fixedHost();
  if (fh) l.forEach(function (p) { p.host = fh; });     /* the server is fixed for every account */
  return l;
};
O.plSave = function (l) { O.store.gs('playlists', l); };
O.fixedHost = function () { var C = window.OSSI_CONFIG || {}; return C.fixedHost && C.host ? normHost(C.host) : ''; };
O.plSetActive = function (id) {
  var l = O.plList(), f = l[0];
  l.forEach(function (x) { if (x.id === id) f = x; });
  O.pl = f; O.store.gs('activePl', f.id);
};
O.plInit = function () { O.plSetActive(O.store.g('activePl', null)); };

/* ---------- formatting ---------- */
O.fmtClock = function (d) {
  var h = d.getHours(), m = d.getMinutes(), mm = (m < 10 ? '0' : '') + m;
  if (O.cfg.get('time', '24') === '12') { var ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + mm + ' ' + ap; }
  return (h < 10 ? '0' : '') + h + ':' + mm;
};
O.fmtDate = function (d) {
  var loc = { ar: 'ar', en: 'en-GB', de: 'de-DE' }[O.lang()] || 'en-GB';
  try { return d.toLocaleDateString(loc, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }); } catch (e) { return d.toDateString(); }
};
O.fmtDur = function (ms) {
  var s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (x < 10 ? '0' : '') + x;
};

/* ---------- ordering helper: saved id order first, unknown items keep original order after ---------- */
O.applyOrder = function (arr, saved, key) {
  if (!saved || !saved.length) return arr.slice();
  var map = {}, out = [], used = {};
  arr.forEach(function (x) { map[x[key]] = x; });
  saved.forEach(function (id) { if (map[id] !== undefined && !used[id]) { out.push(map[id]); used[id] = 1; } });
  arr.forEach(function (x) { if (!used[x[key]]) out.push(x); });
  return out;
};

/* ---------- network ---------- */
O.api = {
  url: function (action, extra) {
    var p = O.pl;
    return p.host + '/player_api.php?username=' + O.enc(p.user) + '&password=' + O.enc(p.pass) +
      (action ? '&action=' + action : '') + (extra || '');
  },
  get: function (action, extra, ok, fail, tries) { return O.getJSON(O.api.url(action, extra), ok, fail, tries); },
  stream: function (kind, id, ext) {
    var p = O.pl;
    return p.host + '/' + kind + '/' + O.enc(p.user) + '/' + O.enc(p.pass) + '/' + O.enc(id) + '.' + ext;
  }
};
O.getJSON = function (url, ok, fail, tries) {
  var ctl = { x: null, dead: false, abort: function () { ctl.dead = true; try { ctl.x.abort(); } catch (e) {} } };
  (function attempt(n) {
    var x = new XMLHttpRequest(), fin = false;
    ctl.x = x;
    function bad(msg) {
      if (fin || ctl.dead) return; fin = true;
      if (n > 0) setTimeout(function () { if (!ctl.dead) attempt(n - 1); }, 1200);
      else if (fail) fail(msg);
    }
    x.open('GET', url, true);
    x.timeout = 60000;
    x.onload = function () {
      if (fin || ctl.dead) return;
      if (x.status < 200 || x.status >= 300) { bad('HTTP ' + x.status); return; }
      var d;
      try { d = JSON.parse(x.responseText); } catch (e) { bad('bad JSON'); return; }
      fin = true; ok(d);
    };
    x.onerror = function () { bad('network'); };
    x.ontimeout = function () { bad('timeout'); };
    x.send();
  })(tries == null ? 2 : tries);
  return ctl;
};

/* ---------- data layer ---------- */
var D = O.data = {};
var ACT = {
  live: ['get_live_categories', 'get_live_streams'],
  movie: ['get_vod_categories', 'get_vod_streams'],
  series: ['get_series_categories', 'get_series']
};
D.reset = function () {
  D.info = null; D.server = null;
  D.cats = { live: null, movie: null, series: null };
  D.liveAll = null; D.byCat = null; D.allLoading = false; D.allCbs = [];
  D.cache = {}; D.cacheKeys = [];
  D.epgC = {}; D.epgQ = []; D.epgWait = {}; D.epgRun = 0;
};
D.reset();
function normCats(d) {
  return Array.isArray(d) ? d.map(function (c) { return { id: String(c.category_id), name: c.category_name || '?' }; }) : [];
}
function norm(type, c) {
  if (type === 'live') return { id: c.stream_id, name: c.name || '?', icon: c.stream_icon || '', cat: String(c.category_id || ''),
    arch: +c.tv_archive === 1 ? (+c.tv_archive_duration || 1) : 0 };
  if (type === 'movie') return { id: c.stream_id, name: c.name || '?', icon: c.stream_icon || '', cat: String(c.category_id || ''), rating: c.rating, ext: c.container_extension || 'mp4' };
  return { id: c.series_id, name: c.name || '?', icon: c.cover || '', cat: String(c.category_id || ''), rating: c.rating };
}
D.loadInfo = function (ok, fail) {
  O.api.get('', null, function (d) {
    D.info = d && d.user_info ? d.user_info : null; D.server = d && d.server_info ? d.server_info : null;
    if (O.onInfo) { try { O.onInfo(D.info); } catch (e) {} }
    if (ok) ok(D.info);
  }, function (e) { if (fail) fail(e); }, 1);
};
D.getCats = function (type, ok, fail) {
  if (D.cats[type]) { ok(D.cats[type]); return null; }
  return O.api.get(ACT[type][0], null, function (d) { D.cats[type] = normCats(d); ok(D.cats[type]); }, fail);
};
D.loadAllLive = function (ok, fail) {
  if (D.liveAll) { if (ok) ok(D.liveAll); return; }
  if (ok || fail) D.allCbs.push([ok, fail]);
  if (D.allLoading) return;
  D.allLoading = true;
  O.api.get(ACT.live[1], null, function (d) {
    var arr = Array.isArray(d) ? d : [], all = new Array(arr.length), by = {};
    for (var i = 0; i < arr.length; i++) {
      var it = norm('live', arr[i]); all[i] = it;
      (by[it.cat] || (by[it.cat] = [])).push(it);
    }
    D.liveAll = all; D.byCat = by; D.allLoading = false;
    var cbs = D.allCbs; D.allCbs = [];
    cbs.forEach(function (c) { if (c[0]) c[0](all); });
  }, function (e) {

/* ---------- rows ---------- */

/* ---------- categories ---------- */
function buildCats() {

function refreshCounts() {

}

}
function onCatOk() {

}
function openCat(entry, toChannels) {
  O.par.guard('live', entry, function () { loadList(entry, toChannels); });
}
function lockedSet() {
  var set = {};

  return set;
}
function loadList(entry, toChannels, keep) {
  S.cur = entry; S.retry = null;
  O.store.ps('last.live', { cat: entry.id });
  S.qh = ''; $('lvChQ').value = '';
  var tk = ++S.tok;
  if (entry.type === 'recent') { setAll(O.recent.list('live'), toChannels, keep); return; }
  if (entry.type === 'fav') { setAll(O.applyOrder(O.fav.list('live'), O.store.p('order.ch.fav', []), 'id'), toChannels, keep); return; }
  S.loading = true; S.all = []; S.view = []; drawCh(); G.cats.draw();
  D.getItems('live', entry.id, function (list) {
    if (tk !== S.tok) return;
    if (entry.type === 'all' && O.par.active()) { var ls = lockedSet(); list = list.filter(function (x) { return !ls[x.cat]; }); }
    setAll(O.applyOrder(list, O.store.p('order.ch.' + entry.id, []), 'id'), toChannels, keep);
  }, function (err) {
    if (tk !== S.tok) return;
    S.loading = false; S.err = err; drawCh();
    S.retry = function () { loadList(entry, toChannels); };
  });
}
function setAll(list, toChannels, keep) {
  S.loading = false; S.err = null; S.all = list; applyView();
  refreshCounts(); G.ch.reset(); if (keep) G.ch.setCur(keep);
  drawCh(); drawInfo(); G.cats.draw();
  if (toChannels && S.view.length) setArea('channels');
}
function applyView() {
  var q = S.qh;
  S.view = q ? S.all.filter(function (c) { return c.name.toLowerCase().indexOf(q) > -1; }) : S.all;

}

/* ---------- preview panel ---------- */

Pl.on(function (ev) {

});
Pl.on(function (ev) {
  if (ev === 'started' && Pl.kind === 'live' && S.full && S.playing) {

});

/* ---------- focus areas ---------- */
function setArea(a) {
  S.area = a;
  G.cats.setActive(a === 'cats'); G.ch.setActive(a === 'channels');
